<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PokeWeb - Coisas 3D</title>
    <style>
        body { margin: 0; padding: 0; background-color: #2c3e50; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'Courier New', Courier, monospace; color: #333; }
        #app-container { width: 90%; max-width: 400px; height: 500px; background-color: #f8f1e5; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); overflow: hidden; display: flex; flex-direction: column; position: relative; }

        .screen { display: none; flex-direction: column; height: 100%; }
        .screen.active { display: flex; }

        .selecao-header { background-color: #333; color: white; padding: 20px; text-align: center; font-weight: bold; }
        .opcoes-grid { display: flex; flex-direction: column; gap: 15px; padding: 20px; flex-grow: 1; justify-content: center; }
        .btn-opcao { display: flex; align-items: center; padding: 10px 20px; border-radius: 10px; border: 2px solid #333; cursor: pointer; font-size: 18px; font-weight: bold; font-family: 'Courier New', Courier, monospace; box-shadow: 0 4px 0 #333; transition: transform 0.1s; }
        .btn-opcao:active { transform: translateY(4px); box-shadow: 0 0 0 #333; }
        .btn-opcao img { width: 48px; height: 48px; object-fit: contain; margin-right: 15px; }
        .btn-regiao { background-color: #fff; justify-content: center; padding: 15px; }
        .btn-tipo-grama { background-color: #c8e6c9; }
        .btn-tipo-fogo { background-color: #ffcdd2; }
        .btn-tipo-agua { background-color: #b3e5fc; }

        .status-bar { display: flex; justify-content: space-around; background-color: #a8d5a2; padding: 15px 0; font-weight: bold; font-size: 18px; border-bottom: 3px solid #7cb575; z-index: 5; }
        #tela-jogo { flex-grow: 1; background-color: #ccebc5; display: flex; flex-direction: column; position: relative; border-bottom: 4px solid #333; transition: background-color 1s; }
        #tela-jogo.dormindo { background-color: #2c3e50; }

        #controles { display: flex; justify-content: center; padding: 20px; background-color: #ecf0f1; z-index: 5; }
        .btn-principal { background-color: #e74c3c; color: white; border: none; padding: 15px 0; width: 80%; border-radius: 10px; font-size: 20px; font-weight: bold; box-shadow: 0 5px 0 #c0392b; cursor: pointer; }
        .btn-principal:active { transform: translateY(5px); box-shadow: 0 0 0 #c0392b; }

        #ovo-container { display: none; flex-direction: column; justify-content: center; align-items: center; width: 100%; height: 100%; }
        #ovo-wrapper { position: relative; width: 80px; height: 100px; display: flex; justify-content: center; align-items: center; }
        .ovo { width: 80px; height: 100px; background-color: #fdf5e6; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; box-shadow: inset -10px -15px 20px rgba(0,0,0,0.15), 0 10px 15px rgba(0,0,0,0.2); animation: ovo-tremendo 3s infinite; }
        .ovo-grama { background-image: radial-gradient(circle at 30% 30%, #2ecc71 12px, transparent 13px), radial-gradient(circle at 75% 60%, #2ecc71 18px, transparent 19px), radial-gradient(circle at 45% 85%, #2ecc71 10px, transparent 11px); }
        .ovo-fogo { background-image: radial-gradient(circle at 30% 30%, #e74c3c 12px, transparent 13px), radial-gradient(circle at 75% 60%, #e74c3c 18px, transparent 19px), radial-gradient(circle at 45% 85%, #e74c3c 10px, transparent 11px); }
        .ovo-agua { background-image: radial-gradient(circle at 30% 30%, #3498db 12px, transparent 13px), radial-gradient(circle at 75% 60%, #3498db 18px, transparent 19px), radial-gradient(circle at 45% 85%, #3498db 10px, transparent 11px); }
        .ovo-metade { position: absolute; top: 0; left: 0; width: 80px; height: 100px; background-color: #fdf5e6; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; }
        .ovo-topo { clip-path: polygon(0% 0%, 100% 0%, 100% 50%, 80% 40%, 60% 55%, 40% 45%, 20% 60%, 0% 50%); animation: rachar-topo 1.5s forwards; }
        .ovo-base { clip-path: polygon(0% 50%, 20% 60%, 40% 45%, 60% 55%, 80% 40%, 100% 50%, 100% 100%, 0% 100%); animation: rachar-base 1.5s forwards; }
        .luz-eclosao { position: absolute; width: 20px; height: 20px; background: white; border-radius: 50%; box-shadow: 0 0 50px 50px white; opacity: 0; animation: brilho-eclosao 1.5s forwards; z-index: 10; }
        #tempo-eclosao { margin-top: 30px; font-weight: bold; font-size: 16px; color: #333; background: rgba(255,255,255,0.5); padding: 5px 15px; border-radius: 15px; }
        #sprite-layer { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow: hidden; }

        @keyframes ovo-tremendo { 0%, 80% { transform: rotate(0deg) scale(1); } 85% { transform: rotate(-10deg) scale(1.05); } 90% { transform: rotate(10deg) scale(1.05); } 95% { transform: rotate(-10deg) scale(1.05); } 100% { transform: rotate(0deg) scale(1); } }
        @keyframes rachar-topo { 0%, 20% { transform: translateY(0) rotate(0); } 30% { transform: translateY(-5px) rotate(-5deg); } 40% { transform: translateY(-5px) rotate(5deg); } 60%, 100% { transform: translateY(-60px) rotate(-25deg); opacity: 0; } }
        @keyframes rachar-base { 0%, 20% { transform: translateY(0); } 30%, 40% { transform: translateY(2px); } 60%, 100% { transform: translateY(40px); opacity: 0; } }
        @keyframes brilho-eclosao { 0%, 40% { opacity: 0; transform: scale(1); } 60% { opacity: 1; transform: scale(4); } 100% { opacity: 1; transform: scale(15); } }

        #screen-hatch { background-color: #2c3e50; justify-content: center; align-items: center; color: white; text-align: center; }
        .hatch-container { background-color: rgba(0,0,0,0.4); padding: 40px; border-radius: 15px; width: 80%; display: flex; flex-direction: column; align-items: center; }
        .hatch-texto { font-size: 22px; font-weight: bold; margin-bottom: 20px; min-height: 30px; }
        #hatch-sprite { width: 80px; image-rendering: pixelated; margin-bottom: 30px; display: none; animation: ovo-tremendo 2s infinite; }

        #menu-overlay { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(44, 62, 80, 0.95); flex-direction: column; justify-content: center; align-items: center; z-index: 10; }
        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 85%; }
        .menu-btn { background-color: #3498db; color: white; border: none; padding: 20px 10px; border-radius: 8px; font-size: 16px; font-weight: bold; box-shadow: 0 5px 0 #2980b9; cursor: pointer; }
        .menu-btn:active { transform: translateY(5px); box-shadow: 0 0 0 #2980b9; }
        .btn-voltar { background-color: #95a5a6; box-shadow: 0 5px 0 #7f8c8d; margin-top: 25px; width: 85%; }

        /* NOVA TELA DE STATUS DETALHADA */
        #status-overlay {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background-color: #34495e; z-index: 20; color: white; flex-direction: column; 
            padding: 20px; box-sizing: border-box; font-family: 'Courier New', Courier, monospace;
        }
        .status-box { background-color: rgba(0,0,0,0.3); padding: 15px; border-radius: 10px; margin-bottom: 15px; }
        .status-header { display: flex; align-items: center; gap: 15px; border-bottom: 2px solid rgba(255,255,255,0.2); padding-bottom: 10px; margin-bottom: 10px; }
        .status-header img { width: 50px; image-rendering: pixelated; }
        .stat-line { display: flex; justify-content: space-between; margin: 5px 0; font-size: 16px; font-weight: bold; }
        .stat-bar-bg { width: 100%; background-color: rgba(255,255,255,0.2); height: 10px; border-radius: 5px; margin-top: 5px; overflow: hidden; }
        .stat-bar-fill { height: 100%; background-color: #2ecc71; }
    </style>
</head>
<body>

    <div id="app-container">
        <!-- ECRÃ 1: ESCOLHER REGIÃO -->
        <div id="screen-region" class="screen">
            <div class="selecao-header">ESCOLHA UMA REGIÃO</div>
            <div class="opcoes-grid">
                <button class="btn-opcao btn-regiao" onclick="mostrarStarters('kanto')">KANTO</button>
                <button class="btn-opcao btn-regiao" onclick="mostrarStarters('johto')">JOHTO</button>
                <button class="btn-opcao btn-regiao" onclick="mostrarStarters('hoenn')">HOENN</button>
            </div>
        </div>

        <!-- ECRÃ 2: ESCOLHER STARTER -->
        <div id="screen-starter" class="screen">
            <div class="selecao-header">ESCOLHA SEU PARCEIRO</div>
            <div class="opcoes-grid" id="lista-starters"></div>
        </div>

        <!-- ECRÃ 3: JOGO PRINCIPAL -->
        <div id="screen-game" class="screen">
            <div class="status-bar">
                <span id="nivel">Nvl: --</span>
                <span id="fome">Fome: --%</span>
            </div>
            <div id="tela-jogo">
                <div id="ovo-container">
                    <div id="ovo-wrapper"></div>
                    <div id="tempo-eclosao"></div>
                </div>
                <div id="sprite-layer"></div>
            </div>
            <div id="controles">
                <button class="btn-principal" onclick="abrirMenu()">MENU</button>
            </div>
            
            <div id="menu-overlay">
                <div class="menu-grid">
                    <button class="menu-btn" onclick="executarAcao('status')">Status</button>
                    <button class="menu-btn" onclick="executarAcao('alimentar')">Alimentar</button>
                    <button class="menu-btn" onclick="executarAcao('dormir')">Dormir / Acordar</button>
                    <button class="menu-btn" onclick="executarAcao('pc')">PC Box</button>
                </div>
                <button class="menu-btn btn-voltar" onclick="fecharMenu()">VOLTAR</button>
            </div>

            <!-- TELA DE STATUS AVANÇADA (SOBREPOSIÇÃO) -->
            <div id="status-overlay">
                <div class="status-box">
                    <div class="status-header">
                        <img id="status-img" src="" alt="Pokemon">
                        <div>
                            <div id="status-nome" style="font-size: 22px; font-weight: bold;">--</div>
                            <div id="status-tipo" style="color: #bdc3c7;">--</div>
                        </div>
                    </div>
                    <div class="stat-line"><span>Level:</span> <span id="status-lvl">--</span></div>
                    <div class="stat-line">
                        <span>EXP: <span id="status-exp" style="font-size: 14px; font-weight:normal;">0%</span></span>
                    </div>
                    <div class="stat-bar-bg"><div id="status-exp-bar" class="stat-bar-fill" style="background-color: #3498db; width: 0%;"></div></div>
                </div>
                
                <div class="status-box" style="flex-grow: 1;">
                    <div style="text-align: center; font-weight: bold; margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 5px;">ATRIBUTOS DE BATALHA</div>
                    <div class="stat-line"><span>HP:</span> <span id="stat-hp">--</span></div>
                    <div class="stat-line"><span>Ataque:</span> <span id="stat-atk">--</span></div>
                    <div class="stat-line"><span>Defesa:</span> <span id="stat-def">--</span></div>
                    <div class="stat-line"><span>Atk. Esp:</span> <span id="stat-spa">--</span></div>
                    <div class="stat-line"><span>Def. Esp:</span> <span id="stat-spd">--</span></div>
                    <div class="stat-line"><span>Velocidade:</span> <span id="stat-spe">--</span></div>
                </div>
                
                <button class="btn-principal" style="width: 100%; background-color: #95a5a6; box-shadow: 0 5px 0 #7f8c8d;" onclick="fecharStatus()">FECHAR</button>
            </div>
        </div>

        <!-- ECRÃ 4: NASCIMENTO -->
        <div id="screen-hatch" class="screen">
            <div class="hatch-container">
                <div id="hatch-texto" class="hatch-texto">Oh?...</div>
                <img id="hatch-sprite" src="">
                <button id="btn-hatch-continuar" class="btn-principal" style="display:none; width:100%; margin-top:10px;" onclick="concluirEclosao()">Continuar</button>
            </div>
        </div>
    </div>

    <script src="database.js"></script>
    <script src="pokemon_engine.js"></script>
    
    <script>
        let mascoteAtivo = null;
        let loopEclosao = null;
        let processoEclosaoEmAndamento = false;

        const SoundManager = {
            play(effect) {
                console.log(`[Áudio Acionado]: Tocando som de '${effect}'`);
            }
        };

        const PetEngine = {
            element: null, state: 'Idle', direction: 'Left', x: 0, y: 0, containerW: 0, containerH: 0,
            speed: 0.5, isRunning: false, pokemonName: '', dormindo: false, actionTimer: 0,

            init(layerId) {
                const layer = document.getElementById(layerId);
                this.containerW = layer.clientWidth; this.containerH = layer.clientHeight;
                this.x = this.containerW / 2; this.y = this.containerH / 2;
                
                if (!this.element) {
                    this.element = document.createElement('img');
                    this.element.style.position = 'absolute';
                    this.element.style.imageRendering = 'pixelated';
                    this.element.style.transformOrigin = 'center center';
                    this.element.style.height = '48px'; 
                    layer.appendChild(this.element);
                }
                this.isRunning = true; this.loop();
            },
            setPokemon(name) {
                this.pokemonName = name.toLowerCase();
                this.element.src = `https://play.pokemonshowdown.com/sprites/gen5ani/${this.pokemonName}.gif`;
                this.changeAction('Idle');
            },
            setDormindo(status) {
                this.dormindo = status;
                if (this.dormindo) { this.element.style.filter = 'brightness(0.3)'; this.changeAction('Idle'); } 
                else { this.element.style.filter = 'none'; }
            },
            changeAction(newState) {
                this.state = newState;
                if (this.state === 'WalkLeft') { this.direction = 'Left'; this.element.style.transform = 'scaleX(1)'; } 
                else if (this.state === 'WalkRight') { this.direction = 'Right'; this.element.style.transform = 'scaleX(-1)'; } 
                else { this.element.style.transform = (this.direction === 'Right') ? 'scaleX(-1)' : 'scaleX(1)'; }
            },
            updateLogic() {
                if (this.dormindo) return;
                if (Date.now() > this.actionTimer) {
                    this.actionTimer = Date.now() + 2000 + Math.random() * 4000;
                    const r = Math.random();
                    if (r < 0.35) this.changeAction('WalkLeft');
                    else if (r < 0.70) this.changeAction('WalkRight');
                    else this.changeAction('Idle');
                }
                if (this.state.startsWith('Walk')) {
                    if (this.direction === 'Right') this.x += this.speed;
                    if (this.direction === 'Left') this.x -= this.speed;
                    if (this.x < 30) { this.x = 30; this.changeAction('WalkRight'); }
                    if (this.x > this.containerW - 30) { this.x = this.containerW - 30; this.changeAction('WalkLeft'); }
                }
            },
            draw() {
                this.element.style.left = (this.x - 24) + 'px';
                this.element.style.top = (this.y - 24) + 'px';
            },
            loop() {
                if (!this.isRunning) return;
                this.updateLogic(); this.draw();
                requestAnimationFrame(() => this.loop());
            }
        };

        function mostrarEcra(idEcra) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(idEcra).classList.add('active');
        }

        async function iniciarJogo() {
            try {
                let saveState = await loadGame();
                if (saveState) {
                    mascoteAtivo = saveState;
                    // RECONECTA AS FUNÇÕES DA CLASSE (Crítico para saves recuperados do IndexedDB)
                    Object.setPrototypeOf(mascoteAtivo, PokemonInstance.prototype);
                    
                    mascoteAtivo = TimeManager.calculateOfflineProgression(mascoteAtivo);
                    await saveGame(mascoteAtivo);
                    mostrarEcra('screen-game');
                    atualizarInterface();
                } else {
                    mostrarEcra('screen-region');
                }
            } catch (erro) { console.error("Erro fatal ao iniciar:", erro); }
        }

        function gerarBotaoStarter(id, nome, tipo) {
            const imgUrl = `https://play.pokemonshowdown.com/sprites/gen5ani/${nome.toLowerCase()}.gif`;
            return `<button class="btn-opcao btn-tipo-${tipo}" onclick="escolherStarter(${id})">
                        <img src="${imgUrl}" alt="${nome}"><span>${nome.toUpperCase()}</span>
                    </button>`;
        }

        function mostrarStarters(regiao) {
            SoundManager.play('menu_click');
            const lista = document.getElementById('lista-starters');
            if (regiao === 'kanto') { lista.innerHTML = gerarBotaoStarter(1, "Bulbasaur", "grama") + gerarBotaoStarter(4, "Charmander", "fogo") + gerarBotaoStarter(7, "Squirtle", "agua"); } 
            else if (regiao === 'johto') { lista.innerHTML = gerarBotaoStarter(152, "Chikorita", "grama") + gerarBotaoStarter(155, "Cyndaquil", "fogo") + gerarBotaoStarter(158, "Totodile", "agua"); } 
            else if (regiao === 'hoenn') { lista.innerHTML = gerarBotaoStarter(252, "Treecko", "grama") + gerarBotaoStarter(255, "Torchic", "fogo") + gerarBotaoStarter(258, "Mudkip", "agua"); }
            mostrarEcra('screen-starter');
        }

        async function escolherStarter(id) {
            SoundManager.play('select_pokemon');
            mascoteAtivo = new PokemonInstance(id);
            await saveGame(mascoteAtivo);
            mostrarEcra('screen-game');
            atualizarInterface();
        }

        function acionarEfeitoEclosao() {
            if (processoEclosaoEmAndamento) return;
            processoEclosaoEmAndamento = true;
            if(loopEclosao) clearInterval(loopEclosao);
            
            const ovoWrapper = document.getElementById('ovo-wrapper');
            const textoEclosao = document.getElementById('tempo-eclosao');
            const tipo = mascoteAtivo.species.type;
            
            textoEclosao.innerText = "Está rachando!";
            SoundManager.play('egg_crack');
            
            ovoWrapper.innerHTML = `
                <div class="luz-eclosao"></div>
                <div class="ovo-metade ovo-base ovo-${tipo}"></div>
                <div class="ovo-metade ovo-topo ovo-${tipo}"></div>
            `;

            setTimeout(() => {
                mostrarEcra('screen-hatch');
                document.getElementById('hatch-texto').innerText = "Oh?...";
                document.getElementById('hatch-sprite').style.display = "none";
                document.getElementById('btn-hatch-continuar').style.display = "none";

                setTimeout(() => {
                    SoundManager.play('pokemon_cry_' + mascoteAtivo.species.id);
                    document.getElementById('hatch-texto').innerText = `Nasceu um ${mascoteAtivo.species.name.toUpperCase()}!`;
                    const sprite = document.getElementById('hatch-sprite');
                    sprite.src = `https://play.pokemonshowdown.com/sprites/gen5ani/${mascoteAtivo.species.name.toLowerCase()}.gif`;
                    sprite.style.display = "block";
                    document.getElementById('btn-hatch-continuar').style.display = "block";
                }, 2000);
            }, 1500);
        }

        function concluirEclosao() {
            SoundManager.play('menu_click');
            mascoteAtivo.isEgg = false;
            saveGame(mascoteAtivo);
            mostrarEcra('screen-game');
            processoEclosaoEmAndamento = false;
            atualizarInterface();
        }

        function atualizarInterface() {
            if (!mascoteAtivo) return;
            
            document.getElementById('nivel').innerText = mascoteAtivo.isEgg ? `Nvl: --` : `Nvl: ${mascoteAtivo.level}`;
            document.getElementById('fome').innerText = mascoteAtivo.isEgg ? `Fome: --%` : `Fome: ${Math.floor(mascoteAtivo.hunger)}%`;

            const ovoContainer = document.getElementById('ovo-container');
            const ovoWrapper = document.getElementById('ovo-wrapper');
            const spriteLayer = document.getElementById('sprite-layer');
            const textoEclosao = document.getElementById('tempo-eclosao');

            if (mascoteAtivo.isEgg) {
                ovoContainer.style.display = 'flex';
                spriteLayer.style.display = 'none';

                const tempoRestante = mascoteAtivo.hatchTime - Date.now();
                if (tempoRestante <= 0) {
                    acionarEfeitoEclosao();
                } else {
                    if (!document.getElementById('ovo-visual')) {
                        ovoWrapper.innerHTML = '<div id="ovo-visual" class="ovo"></div>';
                    }
                    const visualOvo = document.getElementById('ovo-visual');
                    visualOvo.className = `ovo ovo-${mascoteAtivo.species.type}`;
                    textoEclosao.innerText = `Chocando... ${Math.ceil(tempoRestante/1000)}s`;
                    
                    if (tempoRestante <= 15000) { visualOvo.style.animationDuration = "0.5s"; } 
                    else if (tempoRestante <= 30000) { visualOvo.style.animationDuration = "1.5s"; } 
                    else { visualOvo.style.animationDuration = "3s"; }

                    if(!loopEclosao) loopEclosao = setInterval(atualizarInterface, 1000);
                }
            } else {
                ovoContainer.style.display = 'none';
                spriteLayer.style.display = 'block';
                
                if (!PetEngine.isRunning) {
                    PetEngine.init('sprite-layer');
                    PetEngine.setPokemon(mascoteAtivo.species.name);
                }
            }
        }

        function abrirMenu() { SoundManager.play('menu_open'); document.getElementById('menu-overlay').style.display = 'flex'; }
        function fecharMenu() { document.getElementById('menu-overlay').style.display = 'none'; }
        function fecharStatus() { document.getElementById('status-overlay').style.display = 'none'; }

        function abrirStatus() {
            SoundManager.play('menu_click');
            fecharMenu();
            
            // Popula os dados na tela
            document.getElementById('status-img').src = `https://play.pokemonshowdown.com/sprites/gen5ani/${mascoteAtivo.species.name.toLowerCase()}.gif`;
            document.getElementById('status-nome').innerText = mascoteAtivo.species.name.toUpperCase();
            document.getElementById('status-tipo').innerText = `TIPO: ${mascoteAtivo.species.type.toUpperCase()}`;
            document.getElementById('status-lvl').innerText = mascoteAtivo.level;
            
            const expPercent = Math.floor(mascoteAtivo.exp * 100);
            document.getElementById('status-exp').innerText = `${expPercent}%`;
            document.getElementById('status-exp-bar').style.width = `${expPercent}%`;
            
            // Requisita o cálculo matemático do Motor Genético
            const statsReais = mascoteAtivo.calcularStatusReais();
            
            document.getElementById('stat-hp').innerText = statsReais.hp;
            document.getElementById('stat-atk').innerText = statsReais.atk;
            document.getElementById('stat-def').innerText = statsReais.def;
            document.getElementById('stat-spa').innerText = statsReais.spa;
            document.getElementById('stat-spd').innerText = statsReais.spd;
            document.getElementById('stat-spe').innerText = statsReais.spe;
            
            document.getElementById('status-overlay').style.display = 'flex';
        }

        async function executarAcao(acao) {
            if (!mascoteAtivo) return;
            if (mascoteAtivo.isEgg) { alert("Ainda é um ovo! Espere chocar."); fecharMenu(); return; }

            if (acao === 'status') {
                abrirStatus();
                return; // O abrirStatus já fecha o menu
            }
            else if (acao === 'alimentar') {
                if (PetEngine.dormindo) { 
                    alert("O monstrinho está a dormir!"); 
                } else { 
                    SoundManager.play('eat');
                    mascoteAtivo.hunger = Math.min(100, mascoteAtivo.hunger + 25); 
                    await saveGame(mascoteAtivo); 
                    atualizarInterface(); 
                }
            } 
            else if (acao === 'dormir') {
                const telaJogo = document.getElementById('tela-jogo');
                const isDormindo = telaJogo.classList.toggle('dormindo');
                PetEngine.setDormindo(isDormindo);
                SoundManager.play(isDormindo ? 'sleep' : 'wake_up');
            }
            fecharMenu();
        }

        window.onload = iniciarJogo;
    </script>
</body>
</html>
