<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PokeWeb - Coisas 3D</title>
    <style>
        body { margin: 0; padding: 0; background-color: #2c3e50; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'Courier-New', Courier, monospace; color: #333; }
        #app-container { width: 90%; max-width: 400px; height: 500px; background-color: #f8f1e5; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); overflow: hidden; display: flex; flex-direction: column; position: relative; }

        .screen { display: none; flex-direction: column; height: 100%; }
        .screen.active { display: flex; }

        .selecao-header { background-color: #333; color: white; padding: 20px; text-align: center; font-weight: bold; }
        .opcoes-grid { display: flex; flex-direction: column; gap: 15px; padding: 20px; flex-grow: 1; justify-content: center; }
        
        .btn-opcao {
            display: flex; align-items: center; padding: 10px 20px;
            border-radius: 10px; border: 2px solid #333; cursor: pointer;
            font-size: 18px; font-weight: bold; font-family: 'Courier-New', Courier, monospace;
            box-shadow: 0 4px 0 #333; transition: transform 0.1s;
        }
        .btn-opcao:active { transform: translateY(4px); box-shadow: 0 0 0 #333; }
        
        .btn-regiao { background-color: #fff; justify-content: center; padding: 15px; }
        .btn-tipo-grama { background-color: #c8e6c9; }
        .btn-tipo-fogo { background-color: #ffcdd2; }
        .btn-tipo-agua { background-color: #b3e5fc; }

        /* Máscara para extrair apenas o 1º quadro da spritesheet no Menu de Seleção */
        .sprite-btn { 
            width: 48px; height: 48px; 
            object-fit: none; object-position: left top; 
            image-rendering: pixelated; margin-right: 15px; 
        }

        .status-bar { display: flex; justify-content: space-around; background-color: #a8d5a2; padding: 15px 0; font-weight: bold; font-size: 18px; border-bottom: 3px solid #7cb575; z-index: 5; }
        #tela-jogo { flex-grow: 1; background-color: #ccebc5; display: flex; flex-direction: column; justify-content: center; align-items: center; border-bottom: 4px solid #333; position: relative; }
        #controles { display: flex; justify-content: center; padding: 20px; background-color: #ecf0f1; }
        .btn-principal { background-color: #e74c3c; color: white; border: none; padding: 15px 0; width: 80%; border-radius: 10px; font-size: 20px; font-weight: bold; box-shadow: 0 5px 0 #c0392b; cursor: pointer; }
        .btn-principal:active { transform: translateY(5px); box-shadow: 0 0 0 #c0392b; }

        .sprite-container { display: flex; justify-content: center; align-items: center; flex-direction: column; }
        
        /* Máscara para o Sprite na Tela Principal (com zoom) */
        .sprite-main { 
            width: 48px; height: 48px; 
            object-fit: none; object-position: left top; 
            transform: scale(2); /* Dobra o tamanho para destaque na tela central */
            image-rendering: pixelated; 
            animation: pular 1s infinite alternate; 
        }
        
        .ovo { width: 80px; height: 100px; background-color: #fdf5e6; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; box-shadow: inset -10px -10px 20px rgba(0,0,0,0.1); animation: pular 1s infinite alternate, tremer 2s infinite; }
        .ovo-grama { border: 5px solid #2ecc71; }
        .ovo-fogo { border: 5px solid #e74c3c; }
        .ovo-agua { border: 5px solid #3498db; }
        
        #tempo-eclosao { margin-top: 40px; font-weight: bold; font-size: 14px; color: #333; }

        @keyframes pular { from { transform: translateY(0); } to { transform: translateY(-10px); } }
        @keyframes tremer { 0% { margin-left: 0; } 10% { margin-left: -5px; } 20% { margin-left: 5px; } 30% { margin-left: 0; } }

        #menu-overlay { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(44, 62, 80, 0.95); flex-direction: column; justify-content: center; align-items: center; z-index: 10; }
        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 85%; }
        .menu-btn { background-color: #3498db; color: white; border: none; padding: 20px 10px; border-radius: 8px; font-size: 16px; font-weight: bold; box-shadow: 0 5px 0 #2980b9; cursor: pointer; }
        .menu-btn:active { transform: translateY(5px); box-shadow: 0 0 0 #2980b9; }
        .btn-voltar { background-color: #95a5a6; box-shadow: 0 5px 0 #7f8c8d; margin-top: 25px; width: 85%; }
    </style>
</head>
<body>

    <div id="app-container">
        <!-- ECRÃ 1: ESCOLHER REGIÃO -->
        <div id="screen-region" class="screen">
            <div class="selecao-header">ESCOLHA UMA REGIÃO</div>
            <div class="opcoes-grid">
                <button class="btn-opcao btn-regiao" onclick="mostrarStarters('kanto')">KANTO</button>
                <button class="btn-opcao btn-regiao" onclick="mostrarStarters('johto')">JOHTO</button>
                <button class="btn-opcao btn-regiao" onclick="mostrarStarters('hoenn')">HOENN</button>
            </div>
        </div>

        <!-- ECRÃ 2: ESCOLHER STARTER -->
        <div id="screen-starter" class="screen">
            <div class="selecao-header">ESCOLHA SEU PARCEIRO</div>
            <div class="opcoes-grid" id="lista-starters">
                <!-- Botões coloridos com sprites injetados via JS -->
            </div>
        </div>

        <!-- ECRÃ 3: JOGO PRINCIPAL -->
        <div id="screen-game" class="screen">
            <div class="status-bar">
                <span id="nivel">Nvl: --</span>
                <span id="fome">Fome: --%</span>
            </div>
            <div id="tela-jogo">
                <div class="sprite-container" id="monstrinho"></div>
                <div id="tempo-eclosao"></div>
            </div>
            <div id="controles">
                <button class="btn-principal" onclick="abrirMenu()">MENU</button>
            </div>
            
            <div id="menu-overlay">
                <div class="menu-grid">
                    <button class="menu-btn" onclick="executarAcao('status')">Status</button>
                    <button class="menu-btn" onclick="executarAcao('alimentar')">Alimentar</button>
                    <button class="menu-btn" onclick="executarAcao('dormir')">Dormir</button>
                    <button class="menu-btn" onclick="executarAcao('pc')">PC Box</button>
                </div>
                <button class="menu-btn btn-voltar" onclick="fecharMenu()">VOLTAR</button>
            </div>
        </div>
    </div>

    <script src="database.js"></script>
    <script src="pokemon_engine.js"></script>
    
    <script>
        let mascoteAtivo = null;
        let loopEclosao = null;

        function formatarIDPMDCollab(id) {
            return String(id).padStart(4, '0');
        }

        function mostrarEcra(idEcra) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(idEcra).classList.add('active');
        }

        async function iniciarJogo() {
            try {
                let saveState = await loadGame();
                if (saveState) {
                    mascoteAtivo = saveState;
                    mascoteAtivo = TimeManager.calculateOfflineProgression(mascoteAtivo);
                    await saveGame(mascoteAtivo);
                    mostrarEcra('screen-game');
                    atualizarInterface();
                } else {
                    mostrarEcra('screen-region');
                }
            } catch (erro) {
                console.error("Erro fatal ao iniciar:", erro);
            }
        }

        function gerarBotaoStarter(id, nome, tipo) {
            const pmdID = formatarIDPMDCollab(id);
            // URL atualizada para a pasta sprite
            const imgUrl = `https://raw.githubusercontent.com/PMDCollab/SpriteCollab/master/sprite/${pmdID}/Idle-Down.png`;
            return `<button class="btn-opcao btn-tipo-${tipo}" onclick="escolherStarter(${id})">
                        <img src="${imgUrl}" alt="${nome}" class="sprite-btn">
                        <span>${nome.toUpperCase()}</span>
                    </button>`;
        }

        function mostrarStarters(regiao) {
            const lista = document.getElementById('lista-starters');
            let html = '';
            if (regiao === 'kanto') {
                html = gerarBotaoStarter(1, "Bulbasaur", "grama") +
                       gerarBotaoStarter(4, "Charmander", "fogo") +
                       gerarBotaoStarter(7, "Squirtle", "agua");
            } else if (regiao === 'johto') {
                html = gerarBotaoStarter(152, "Chikorita", "grama") +
                       gerarBotaoStarter(155, "Cyndaquil", "fogo") +
                       gerarBotaoStarter(158, "Totodile", "agua");
            } else if (regiao === 'hoenn') {
                html = gerarBotaoStarter(252, "Treecko", "grama") +
                       gerarBotaoStarter(255, "Torchic", "fogo") +
                       gerarBotaoStarter(258, "Mudkip", "agua");
            }
            lista.innerHTML = html;
            mostrarEcra('screen-starter');
        }

        async function escolherStarter(id) {
            mascoteAtivo = new PokemonInstance(id);
            await saveGame(mascoteAtivo);
            mostrarEcra('screen-game');
            atualizarInterface();
        }

        function atualizarInterface() {
            if (!mascoteAtivo) return;
            
            document.getElementById('nivel').innerText = mascoteAtivo.isEgg ? `Nvl: --` : `Nvl: ${mascoteAtivo.level}`;
            document.getElementById('fome').innerText = mascoteAtivo.isEgg ? `Fome: --%` : `Fome: ${Math.floor(mascoteAtivo.hunger)}%`;

            const container = document.getElementById('monstrinho');
            const textoEclosao = document.getElementById('tempo-eclosao');

            if (mascoteAtivo.isEgg) {
                const tempoRestante = mascoteAtivo.hatchTime - Date.now();
                if (tempoRestante <= 0) {
                    mascoteAtivo.isEgg = false;
                    saveGame(mascoteAtivo);
                    atualizarInterface();
                    if(loopEclosao) clearInterval(loopEclosao);
                } else {
                    const tipo = mascoteAtivo.species.type;
                    container.innerHTML = `<div class="ovo ovo-${tipo}"></div>`;
                    textoEclosao.innerText = `Chocando... ${Math.ceil(tempoRestante/1000)}s`;
                    if(!loopEclosao) loopEclosao = setInterval(atualizarInterface, 1000);
                }
            } else {
                textoEclosao.innerText = "";
                const pmdID = formatarIDPMDCollab(mascoteAtivo.species.id);
                // URL atualizada para a pasta sprite
                container.innerHTML = `<img src="https://raw.githubusercontent.com/PMDCollab/SpriteCollab/master/sprite/${pmdID}/Idle-Down.png" alt="${mascoteAtivo.species.name}" class="sprite-main">`;
            }
        }

        function abrirMenu() { document.getElementById('menu-overlay').style.display = 'flex'; }
        function fecharMenu() { document.getElementById('menu-overlay').style.display = 'none'; }

        async function executarAcao(acao) {
            if (!mascoteAtivo) return;
            if (mascoteAtivo.isEgg) {
                alert("Ainda é um ovo! Espere chocar.");
                fecharMenu();
                return;
            }
            if (acao === 'alimentar') {
                mascoteAtivo.hunger = Math.min(100, mascoteAtivo.hunger + 25);
                await saveGame(mascoteAtivo);
                atualizarInterface();
            }
            fecharMenu();
        }

        window.onload = iniciarJogo;
    </script>
</body>
</html>
