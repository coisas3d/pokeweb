<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PokeWeb - Coisas 3D</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Courier New', Courier, monospace;
            color: #333;
        }

        #app-container {
            width: 90%;
            max-width: 400px;
            height: 500px;
            background-color: #f1f2f6;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .status-bar {
            width: 100%;
            display: flex;
            justify-content: space-around;
            background-color: #a8d5a2;
            padding: 15px 0;
            font-weight: bold;
            font-size: 18px;
            border-bottom: 3px solid #7cb575;
            z-index: 5;
        }

        #tela-jogo {
            flex-grow: 1;
            background-color: #ccebc5;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-bottom: 4px solid #333;
            position: relative;
        }

        /* Container ajustado para receber uma imagem real em vez de texto */
        .sprite {
            display: flex;
            justify-content: center;
            align-items: center;
            animation: pular 1s infinite alternate;
        }

        /* Garante que a imagem do Pokémon fique com os pixels definidos (estilo retrô) e não embaçada */
        .sprite img {
            width: 150px;
            image-rendering: pixelated; 
        }

        @keyframes pular {
            from { transform: translateY(0); }
            to { transform: translateY(-10px); }
        }

        #controles {
            display: flex;
            justify-content: center;
            padding: 20px;
            background-color: #ecf0f1;
        }

        .btn-principal {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 15px 0;
            width: 80%;
            border-radius: 10px;
            font-size: 20px;
            font-weight: bold;
            box-shadow: 0 5px 0 #c0392b;
            cursor: pointer;
        }
        
        .btn-principal:active {
            transform: translateY(5px);
            box-shadow: 0 0 0 #c0392b;
        }

        #menu-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(44, 62, 80, 0.95);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            width: 85%;
        }

        .menu-btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 20px 10px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 5px 0 #2980b9;
            cursor: pointer;
        }

        .menu-btn:active {
            transform: translateY(5px);
            box-shadow: 0 0 0 #2980b9;
        }

        .btn-voltar {
            background-color: #95a5a6;
            box-shadow: 0 5px 0 #7f8c8d;
            margin-top: 25px;
            width: 85%;
        }
        
        /* Escurece a tela quando o mascote está dormindo */
        .dormindo {
            background-color: #2c3e50 !important;
        }
    </style>
</head>
<body>

    <div id="app-container">
        <div class="status-bar">
            <span id="nivel">Nvl: --</span>
            <span id="fome">Fome: --%</span>
        </div>
        
        <!-- Tela Principal -->
        <div id="tela-jogo">
            <div class="sprite" id="monstrinho">
                <!-- A imagem será injetada aqui pelo JavaScript -->
            </div>
        </div>

        <div id="controles">
            <button class="btn-principal" onclick="abrirMenu()">MENU</button>
        </div>

        <div id="menu-overlay">
            <div class="menu-grid">
                <button class="menu-btn" onclick="executarAcao('status')">Status</button>
                <button class="menu-btn" onclick="executarAcao('alimentar')">Alimentar</button>
                <button class="menu-btn" onclick="executarAcao('dormir')">Dormir / Acordar</button>
                <button class="menu-btn" onclick="executarAcao('pc')">PC Box</button>
            </div>
            <button class="menu-btn" style="grid-column: span 2; background-color: #e67e22; box-shadow: 0 5px 0 #d35400; margin-top: 15px;" onclick="executarAcao('batalhar')">BATALHAR</button>
            
            <button class="menu-btn btn-voltar" onclick="fecharMenu()">VOLTAR</button>
        </div>
    </div>

    <!-- O motor lógico e o banco de dados carregados aqui -->
    <script src="database.js"></script>
    <script src="pokemon_engine.js"></script>
    
    <script>
        let mascoteAtivo = null;
        let isSleeping = false; // Controle de estado de sono

        function abrirMenu() {
            document.getElementById('menu-overlay').style.display = 'flex';
        }

        function fecharMenu() {
            document.getElementById('menu-overlay').style.display = 'none';
        }

        async function iniciarJogo() {
            try {
                let saveState = await loadGame();

                if (saveState) {
                    mascoteAtivo = saveState;
                    mascoteAtivo = TimeManager.calculateOfflineProgression(mascoteAtivo);
                    await saveGame(mascoteAtivo);
                } else {
                    mascoteAtivo = new PokemonInstance(1);
                    await saveGame(mascoteAtivo);
                }

                atualizarInterface();
                
            } catch (erro) {
                console.error("Erro fatal ao iniciar:", erro);
            }
        }

        function atualizarInterface() {
            if (!mascoteAtivo) return;
            
            // Atualiza os textos
            document.getElementById('nivel').innerText = `Nvl: ${mascoteAtivo.level}`;
            document.getElementById('fome').innerText = `Fome: ${Math.floor(mascoteAtivo.hunger)}%`;

            // Lógica de Renderização do Sprite
            const spriteContainer = document.getElementById('monstrinho');
            const pokemonId = mascoteAtivo.species.id;
            
            // Injeta a imagem oficial do Pokémon correspondente ao ID
            spriteContainer.innerHTML = `<img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${pokemonId}.png" alt="${mascoteAtivo.species.name}">`;
        }

        async function executarAcao(acao) {
            if (!mascoteAtivo) return;

            if (acao === 'alimentar') {
                if (isSleeping) {
                    alert("O monstrinho está dormindo!");
                } else {
                    mascoteAtivo.hunger = Math.min(100, mascoteAtivo.hunger + 25);
                    await saveGame(mascoteAtivo);
                    atualizarInterface();
                }
            } 
            else if (acao === 'dormir') {
                const telaJogo = document.getElementById('tela-jogo');
                isSleeping = !isSleeping; // Inverte o estado (dorme ou acorda)
                
                if (isSleeping) {
                    telaJogo.classList.add('dormindo');
                } else {
                    telaJogo.classList.remove('dormindo');
                }
            }
            else {
                console.log("Ação não programada ainda:", acao);
            }

            fecharMenu();
        }

        window.onload = iniciarJogo;
    </script>
</body>
</html>
