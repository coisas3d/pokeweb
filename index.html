<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PokeWeb - Coisas 3D</title>
    <style>
        body { margin: 0; padding: 0; background-color: #2c3e50; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'Courier New', Courier, monospace; color: #333; }
        #app-container { width: 90%; max-width: 400px; height: 500px; background-color: #f8f1e5; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); overflow: hidden; display: flex; flex-direction: column; position: relative; }

        .screen { display: none; flex-direction: column; height: 100%; }
        .screen.active { display: flex; }

        .selecao-header { background-color: #333; color: white; padding: 20px; text-align: center; font-weight: bold; }
        .opcoes-grid { display: flex; flex-direction: column; gap: 15px; padding: 20px; flex-grow: 1; justify-content: center; }
        
        .btn-opcao {
            display: flex; align-items: center; padding: 10px 20px;
            border-radius: 10px; border: 2px solid #333; cursor: pointer;
            font-size: 18px; font-weight: bold; font-family: 'Courier New', Courier, monospace;
            box-shadow: 0 4px 0 #333; transition: transform 0.1s;
        }
        .btn-opcao:active { transform: translateY(4px); box-shadow: 0 0 0 #333; }
        .btn-opcao img { width: 48px; height: 48px; object-fit: none; object-position: left top; image-rendering: pixelated; margin-right: 15px; }
        
        .btn-regiao { background-color: #fff; justify-content: center; padding: 15px; }
        .btn-tipo-grama { background-color: #c8e6c9; }
        .btn-tipo-fogo { background-color: #ffcdd2; }
        .btn-tipo-agua { background-color: #b3e5fc; }

        .status-bar { display: flex; justify-content: space-around; background-color: #a8d5a2; padding: 15px 0; font-weight: bold; font-size: 18px; border-bottom: 3px solid #7cb575; z-index: 5; }
        
        /* A tela principal agora lida com o modo noturno suavemente */
        #tela-jogo { flex-grow: 1; background-color: #ccebc5; display: flex; flex-direction: column; position: relative; border-bottom: 4px solid #333; transition: background-color 1s; }
        #tela-jogo.dormindo { background-color: #2c3e50; }

        #controles { display: flex; justify-content: center; padding: 20px; background-color: #ecf0f1; z-index: 5; }
        .btn-principal { background-color: #e74c3c; color: white; border: none; padding: 15px 0; width: 80%; border-radius: 10px; font-size: 20px; font-weight: bold; box-shadow: 0 5px 0 #c0392b; cursor: pointer; }
        .btn-principal:active { transform: translateY(5px); box-shadow: 0 0 0 #c0392b; }

        /* Container do Ovo */
        #ovo-container { display: none; flex-direction: column; justify-content: center; align-items: center; width: 100%; height: 100%; }
        .ovo { width: 80px; height: 100px; background-color: #fdf5e6; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; box-shadow: inset -10px -10px 20px rgba(0,0,0,0.1); animation: pular 1s infinite alternate, tremer 2s infinite; }
        .ovo-grama { border: 5px solid #2ecc71; }
        .ovo-fogo { border: 5px solid #e74c3c; }
        .ovo-agua { border: 5px solid #3498db; }
        #tempo-eclosao { margin-top: 25px; font-weight: bold; font-size: 16px; color: #333; }

        /* Camada dinâmica onde o motor 2D vai renderizar os Sprites */
        #sprite-layer { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow: hidden; }

        @keyframes pular { from { transform: translateY(0); } to { transform: translateY(-10px); } }
        @keyframes tremer { 0% { margin-left: 0; } 10% { margin-left: -5px; } 20% { margin-left: 5px; } 30% { margin-left: 0; } }

        #menu-overlay { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(44, 62, 80, 0.95); flex-direction: column; justify-content: center; align-items: center; z-index: 10; }
        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 85%; }
        .menu-btn { background-color: #3498db; color: white; border: none; padding: 20px 10px; border-radius: 8px; font-size: 16px; font-weight: bold; box-shadow: 0 5px 0 #2980b9; cursor: pointer; }
        .menu-btn:active { transform: translateY(5px); box-shadow: 0 0 0 #2980b9; }
        .btn-voltar { background-color: #95a5a6; box-shadow: 0 5px 0 #7f8c8d; margin-top: 25px; width: 85%; }
    </style>
</head>
<body>

    <div id="app-container">
        <!-- ECRÃ 1: ESCOLHER REGIÃO -->
        <div id="screen-region" class="screen">
            <div class="selecao-header">ESCOLHA UMA REGIÃO</div>
            <div class="opcoes-grid">
                <button class="btn-opcao btn-regiao" onclick="mostrarStarters('kanto')">KANTO</button>
                <button class="btn-opcao btn-regiao" onclick="mostrarStarters('johto')">JOHTO</button>
                <button class="btn-opcao btn-regiao" onclick="mostrarStarters('hoenn')">HOENN</button>
            </div>
        </div>

        <!-- ECRÃ 2: ESCOLHER STARTER -->
        <div id="screen-starter" class="screen">
            <div class="selecao-header">ESCOLHA SEU PARCEIRO</div>
            <div class="opcoes-grid" id="lista-starters"></div>
        </div>

        <!-- ECRÃ 3: JOGO PRINCIPAL -->
        <div id="screen-game" class="screen">
            <div class="status-bar">
                <span id="nivel">Nvl: --</span>
                <span id="fome">Fome: --%</span>
            </div>
            
            <div id="tela-jogo">
                <!-- Estado Ovo -->
                <div id="ovo-container">
                    <div id="ovo-visual"></div>
                    <div id="tempo-eclosao"></div>
                </div>
                <!-- Estado Pokemon (Gerido pelo Motor 2D) -->
                <div id="sprite-layer"></div>
            </div>

            <div id="controles">
                <button class="btn-principal" onclick="abrirMenu()">MENU</button>
            </div>
            
            <div id="menu-overlay">
                <div class="menu-grid">
                    <button class="menu-btn" onclick="executarAcao('status')">Status</button>
                    <button class="menu-btn" onclick="executarAcao('alimentar')">Alimentar</button>
                    <button class="menu-btn" onclick="executarAcao('dormir')">Dormir / Acordar</button>
                    <button class="menu-btn" onclick="executarAcao('pc')">PC Box</button>
                </div>
                <button class="menu-btn btn-voltar" onclick="fecharMenu()">VOLTAR</button>
            </div>
        </div>
    </div>

    <script src="database.js"></script>
    <script src="pokemon_engine.js"></script>
    
    <script>
        let mascoteAtivo = null;
        let loopEclosao = null;

        // --- MOTOR DE ANIMAÇÃO AUTÔNOMO 2D ---
        const SpriteEngine = {
            element: null, state: 'Idle', direction: 'Down',
            x: 0, y: 0, containerW: 0, containerH: 0,
            image: new Image(), frames: 1, currentFrame: 0,
            lastFrameTime: 0, frameDuration: 180, actionTimer: 0,
            speed: 1.5, isRunning: false, pokemonId: '', dormindo: false,

            init(layerId) {
                const layer = document.getElementById(layerId);
                this.containerW = layer.clientWidth;
                this.containerH = layer.clientHeight;
                this.x = this.containerW / 2;
                this.y = this.containerH / 2;
                
                if (!this.element) {
                    this.element = document.createElement('div');
                    this.element.style.position = 'absolute';
                    this.element.style.imageRendering = 'pixelated';
                    this.element.style.transform = 'scale(2)'; 
                    this.element.style.transformOrigin = 'center center';
                    layer.appendChild(this.element);
                }
                this.isRunning = true;
                this.loop();
            },

            setPokemon(id) {
                this.pokemonId = String(id).padStart(4, '0');
                this.changeAction('Idle', 'Down');
            },

            setDormindo(status) {
                this.dormindo = status;
                if (this.dormindo) this.changeAction('Idle', 'Down');
            },

            changeAction(newState, newDir) {
                if (this.state === newState && this.direction === newDir) return;
                this.state = newState;
                this.direction = newDir;
                this.currentFrame = 0;
                
                const imgUrl = `https://raw.githubusercontent.com/PMDCollab/SpriteCollab/master/sprite/${this.pokemonId}/${this.state}-${this.direction}.png`;
                
                const tempImg = new Image();
                tempImg.onload = () => {
                    this.image = tempImg;
                    const frameSize = this.image.height;
                    this.frames = Math.max(1, Math.floor(this.image.width / frameSize)); // Cálculo matemático de quadros
                    this.element.style.width = frameSize + 'px';
                    this.element.style.height = frameSize + 'px';
                    this.element.style.backgroundImage = `url(${this.image.src})`;
                };
                tempImg.onerror = () => {
                    // Fallback se uma direção não existir
                    if (this.state !== 'Idle' || this.direction !== 'Down') this.changeAction('Idle', 'Down');
                };
                tempImg.src = imgUrl;
            },

            updateLogic() {
                if (this.dormindo) return; // Congela se estiver dormindo

                // Cérebro Autônomo
                if (Date.now() > this.actionTimer) {
                    this.actionTimer = Date.now() + 2000 + Math.random() * 3000;
                    if (Math.random() < 0.4) {
                        const dirs = ['Down', 'Up', 'Left', 'Right'];
                        this.changeAction('Walk', dirs[Math.floor(Math.random() * dirs.length)]);
                    } else {
                        const dirs = ['Down', 'Up', 'Left', 'Right'];
                        this.changeAction('Idle', dirs[Math.floor(Math.random() * dirs.length)]);
                    }
                }

                // Cálculo de Colisão e Deslocamento
                if (this.state === 'Walk' && this.image.complete && this.image.height > 0) {
                    const limit = this.image.height; // Buffer para bater nas bordas
                    if (this.direction === 'Right') this.x += this.speed;
                    if (this.direction === 'Left') this.x -= this.speed;
                    if (this.direction === 'Down') this.y += this.speed;
                    if (this.direction === 'Up') this.y -= this.speed;

                    this.x = Math.max(limit, Math.min(this.containerW - limit, this.x));
                    this.y = Math.max(limit, Math.min(this.containerH - limit, this.y));
                }
            },

            draw() {
                if (!this.image.complete || this.image.height === 0) return;
                
                if (Date.now() - this.lastFrameTime > this.frameDuration) {
                    this.currentFrame = (this.currentFrame + 1) % this.frames;
                    this.lastFrameTime = Date.now();
                }

                const frameSize = this.image.height;
                this.element.style.backgroundPosition = `-${this.currentFrame * frameSize}px 0px`;
                this.element.style.left = (this.x - frameSize/2) + 'px';
                this.element.style.top = (this.y - frameSize/2) + 'px';
            },

            loop() {
                if (!this.isRunning) return;
                this.updateLogic();
                this.draw();
                requestAnimationFrame(() => this.loop());
            }
        };
        // -------------------------------------

        function mostrarEcra(idEcra) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(idEcra).classList.add('active');
        }

        async function iniciarJogo() {
            try {
                let saveState = await loadGame();
                if (saveState) {
                    mascoteAtivo = saveState;
                    mascoteAtivo = TimeManager.calculateOfflineProgression(mascoteAtivo);
                    await saveGame(mascoteAtivo);
                    mostrarEcra('screen-game');
                    atualizarInterface();
                } else {
                    mostrarEcra('screen-region');
                }
            } catch (erro) {
                console.error("Erro fatal ao iniciar:", erro);
            }
        }

        function gerarBotaoStarter(id, nome, tipo) {
            const pmdID = String(id).padStart(4, '0');
            const imgUrl = `https://raw.githubusercontent.com/PMDCollab/SpriteCollab/master/sprite/${pmdID}/Idle-Down.png`;
            return `<button class="btn-opcao btn-tipo-${tipo}" onclick="escolherStarter(${id})">
                        <img src="${imgUrl}" alt="${nome}">
                        <span>${nome.toUpperCase()}</span>
                    </button>`;
        }

        function mostrarStarters(regiao) {
            const lista = document.getElementById('lista-starters');
            if (regiao === 'kanto') {
                lista.innerHTML = gerarBotaoStarter(1, "Bulbasaur", "grama") + gerarBotaoStarter(4, "Charmander", "fogo") + gerarBotaoStarter(7, "Squirtle", "agua");
            } else if (regiao === 'johto') {
                lista.innerHTML = gerarBotaoStarter(152, "Chikorita", "grama") + gerarBotaoStarter(155, "Cyndaquil", "fogo") + gerarBotaoStarter(158, "Totodile", "agua");
            } else if (regiao === 'hoenn') {
                lista.innerHTML = gerarBotaoStarter(252, "Treecko", "grama") + gerarBotaoStarter(255, "Torchic", "fogo") + gerarBotaoStarter(258, "Mudkip", "agua");
            }
            mostrarEcra('screen-starter');
        }

        async function escolherStarter(id) {
            mascoteAtivo = new PokemonInstance(id);
            await saveGame(mascoteAtivo);
            mostrarEcra('screen-game');
            atualizarInterface();
        }

        function atualizarInterface() {
            if (!mascoteAtivo) return;
            
            document.getElementById('nivel').innerText = mascoteAtivo.isEgg ? `Nvl: --` : `Nvl: ${mascoteAtivo.level}`;
            document.getElementById('fome').innerText = mascoteAtivo.isEgg ? `Fome: --%` : `Fome: ${Math.floor(mascoteAtivo.hunger)}%`;

            const ovoContainer = document.getElementById('ovo-container');
            const spriteLayer = document.getElementById('sprite-layer');
            const textoEclosao = document.getElementById('tempo-eclosao');
            const visualOvo = document.getElementById('ovo-visual');

            if (mascoteAtivo.isEgg) {
                ovoContainer.style.display = 'flex';
                spriteLayer.style.display = 'none';

                const tempoRestante = mascoteAtivo.hatchTime - Date.now();
                if (tempoRestante <= 0) {
                    mascoteAtivo.isEgg = false;
                    saveGame(mascoteAtivo);
                    atualizarInterface();
                    if(loopEclosao) clearInterval(loopEclosao);
                } else {
                    visualOvo.className = `ovo ovo-${mascoteAtivo.species.type}`;
                    textoEclosao.innerText = `Chocando... ${Math.ceil(tempoRestante/1000)}s`;
                    if(!loopEclosao) loopEclosao = setInterval(atualizarInterface, 1000);
                }
            } else {
                ovoContainer.style.display = 'none';
                spriteLayer.style.display = 'block';
                
                // Inicializa o Motor 2D se ainda não estiver rodando
                if (!SpriteEngine.isRunning) {
                    SpriteEngine.init('sprite-layer');
                    SpriteEngine.setPokemon(mascoteAtivo.species.id);
                }
            }
        }

        function abrirMenu() { document.getElementById('menu-overlay').style.display = 'flex'; }
        function fecharMenu() { document.getElementById('menu-overlay').style.display = 'none'; }

        async function executarAcao(acao) {
            if (!mascoteAtivo) return;
            
            if (mascoteAtivo.isEgg) {
                alert("Ainda é um ovo! Espere chocar.");
                fecharMenu();
                return;
            }

            if (acao === 'alimentar') {
                if (SpriteEngine.dormindo) {
                    alert("O monstrinho está dormindo!");
                } else {
                    mascoteAtivo.hunger = Math.min(100, mascoteAtivo.hunger + 25);
                    await saveGame(mascoteAtivo);
                    atualizarInterface();
                }
            }
            else if (acao === 'dormir') {
                const telaJogo = document.getElementById('tela-jogo');
                const isDormindo = telaJogo.classList.toggle('dormindo');
                SpriteEngine.setDormindo(isDormindo);
            }
            
            fecharMenu();
        }

        window.onload = iniciarJogo;
    </script>
</body>
</html>
