<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PokeWeb - Coisas 3D</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Courier New', Courier, monospace;
            color: #333;
        }

        #app-container {
            width: 90%;
            max-width: 400px;
            height: 500px;
            background-color: #f1f2f6;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .status-bar {
            width: 100%;
            display: flex;
            justify-content: space-around;
            background-color: #a8d5a2;
            padding: 15px 0;
            font-weight: bold;
            font-size: 18px;
            border-bottom: 3px solid #7cb575;
            z-index: 5;
        }

        #tela-jogo {
            flex-grow: 1;
            background-color: #ccebc5;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-bottom: 4px solid #333;
        }

        .sprite {
            font-size: 100px; 
            animation: pular 1s infinite alternate;
        }

        @keyframes pular {
            from { transform: translateY(0); }
            to { transform: translateY(-10px); }
        }

        #controles {
            display: flex;
            justify-content: center;
            padding: 20px;
            background-color: #ecf0f1;
        }

        .btn-principal {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 15px 0;
            width: 80%;
            border-radius: 10px;
            font-size: 20px;
            font-weight: bold;
            box-shadow: 0 5px 0 #c0392b;
            cursor: pointer;
        }
        
        .btn-principal:active {
            transform: translateY(5px);
            box-shadow: 0 0 0 #c0392b;
        }

        #menu-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(44, 62, 80, 0.95);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            width: 85%;
        }

        .menu-btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 20px 10px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 5px 0 #2980b9;
            cursor: pointer;
        }

        .menu-btn:active {
            transform: translateY(5px);
            box-shadow: 0 0 0 #2980b9;
        }

        .btn-voltar {
            background-color: #95a5a6;
            box-shadow: 0 5px 0 #7f8c8d;
            margin-top: 25px;
            width: 85%;
        }
    </style>
</head>
<body>

    <div id="app-container">
        <!-- TELA PRINCIPAL (IDLE STATE) -->
        <div class="status-bar">
            <span id="nivel">Nvl: --</span>
            <span id="fome">Fome: --%</span>
        </div>
        
        <div id="tela-jogo">
            <div class="sprite" id="monstrinho">🥚</div>
        </div>

        <div id="controles">
            <button class="btn-principal" onclick="abrirMenu()">MENU</button>
        </div>

        <!-- TELA DE MENU (MENU STATE) -->
        <div id="menu-overlay">
            <div class="menu-grid">
                <button class="menu-btn" onclick="executarAcao('status')">Status</button>
                <button class="menu-btn" onclick="executarAcao('alimentar')">Alimentar</button>
                <button class="menu-btn" onclick="executarAcao('dormir')">Dormir</button>
                <button class="menu-btn" onclick="executarAcao('pc')">PC Box</button>
            </div>
            <!-- Botão de batalha -->
            <button class="menu-btn" style="grid-column: span 2; background-color: #e67e22; box-shadow: 0 5px 0 #d35400; margin-top: 15px;" onclick="executarAcao('batalhar')">BATALHAR</button>
            
            <button class="menu-btn btn-voltar" onclick="fecharMenu()">VOLTAR</button>
        </div>
    </div>

    <!-- O motor lógico e o banco de dados carregados aqui -->
    <script src="database.js"></script>
    <script src="pokemon_engine.js"></script>
    
    <!-- Lógica de interface da página (View) -->
    <script>
        // Variável global que segura o mascote atual na memória da tela
        let mascoteAtivo = null;

        function abrirMenu() {
            document.getElementById('menu-overlay').style.display = 'flex';
        }

        function fecharMenu() {
            document.getElementById('menu-overlay').style.display = 'none';
        }

        // Função que roda automaticamente assim que o cliente abre a página
        async function iniciarJogo() {
            try {
                // 1. Tenta carregar o save do celular do cliente
                let saveState = await loadGame();

                if (saveState) {
                    // Se existe, restaura os dados
                    mascoteAtivo = saveState;
                    // 2. Calcula o que aconteceu offline
                    mascoteAtivo = TimeManager.calculateOfflineProgression(mascoteAtivo);
                    // 3. Salva imediatamente
                    await saveGame(mascoteAtivo);
                } else {
                    // 4. Se for o primeiro acesso, cria um Bulbasaur nível 5
                    mascoteAtivo = new PokemonInstance(1);
                    await saveGame(mascoteAtivo);
                }

                // 5. Atualiza os textos na tela
                atualizarInterface();
                
            } catch (erro) {
                console.error("Erro fatal ao iniciar:", erro);
            }
        }

        function atualizarInterface() {
            if (!mascoteAtivo) return;
            document.getElementById('nivel').innerText = `Nvl: ${mascoteAtivo.level}`;
            document.getElementById('fome').innerText = `Fome: ${Math.floor(mascoteAtivo.hunger)}%`;
        }

        // Conectando as ações do menu ao banco de dados
        async function executarAcao(acao) {
            if (!mascoteAtivo) return;

            if (acao === 'alimentar') {
                // Adiciona 25% de fome, não passando de 100
                mascoteAtivo.hunger = Math.min(100, mascoteAtivo.hunger + 25);
                
                // Salva o novo status no IndexedDB
                await saveGame(mascoteAtivo);
                
                // Atualiza a tela imediatamente
                atualizarInterface();
            } else {
                console.log("Ação não programada ainda:", acao);
            }

            fecharMenu();
        }

        // Gatilho de inicialização
        window.onload = iniciarJogo;
    </script>
</body>
</html>
