<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PokeWeb - PMD Engine Local</title>
    <style>
        /* BASE & TIPOGRAFIA PREMIUM */
        body { 
            margin: 0; padding: 0; 
            background: linear-gradient(135deg, #0f172a 0%, #020617 100%); 
            display: flex; justify-content: center; align-items: center; 
            height: 100dvh; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            color: #333; overflow: hidden; user-select: none;
        }
        
        #app-container { 
            width: 100%; max-width: 400px; height: 100%; max-height: 850px; 
            background-color: #0f172a; 
            border-radius: 30px; 
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.8), inset 0 0 0 8px #0f172a; 
            overflow: hidden; display: flex; flex-direction: column; position: relative; 
        }

        @media (max-height: 700px) {
            #app-container { border-radius: 0; max-height: 100dvh; box-shadow: none; border: none; }
        }

        .premium-bg {
            background-image: url('https://raw.githubusercontent.com/coisas3d/pokeweb/main/bioma/back_normal_night.jpg');
            background-size: cover; background-position: center bottom; position: relative;
        }
        .premium-bg::before {
            content: ''; position: absolute; inset: 0; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(8px); z-index: 0;
        }

        .screen { display: none; flex-direction: column; height: 100%; width: 100%; position: absolute; top: 0; left: 0; z-index: 10; background-color: #0f172a; }
        .screen.active { display: flex; }

        .selecao-header { 
            position: relative; z-index: 5; color: white; padding: 40px 20px 20px 20px; text-align: center; 
            font-weight: 800; font-size: 20px; letter-spacing: 2px; text-transform: uppercase; text-shadow: 0 4px 15px rgba(0,0,0,0.8);
        }
        
        .premium-card {
            position: relative; z-index: 5; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-radius: 28px; margin: 0 20px; padding: 35px 20px;
            display: flex; flex-direction: column; align-items: center; box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .starter-list { width: 100%; display: flex; flex-direction: column; gap: 15px; }
        .btn-starter { 
            display: flex; align-items: center; padding: 12px 20px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.15); 
            cursor: pointer; font-size: 16px; font-weight: 800; color: white; background: rgba(0, 0, 0, 0.5); 
            box-shadow: 0 8px 20px rgba(0,0,0,0.3); transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); text-transform: uppercase; letter-spacing: 1px;
        }
        .btn-starter:active { transform: scale(0.96); background: rgba(0, 0, 0, 0.7); }
        .starter-sprite-box { width: 60px; height: 60px; display: flex; justify-content: center; align-items: flex-end; margin-right: 15px; position: relative; }

        .premium-input {
            width: 100%; box-sizing: border-box; padding: 18px 20px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.2); 
            background: rgba(0,0,0,0.4); font-size: 18px; font-weight: bold; text-align: center; color: white; text-transform: uppercase;
            outline: none; transition: border 0.3s; box-shadow: inset 0 4px 10px rgba(0,0,0,0.5);
        }
        .premium-input::placeholder { color: rgba(255,255,255,0.3); }
        .premium-input:focus { border-color: #3b82f6; background: rgba(0,0,0,0.6); }

        .btn-action-glass {
            width: 100%; padding: 20px 0; margin-top: 30px; border-radius: 20px;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8); color: white; font-weight: 800; font-size: 16px; letter-spacing: 2px;
            border: none; cursor: pointer; transition: all 0.2s; box-shadow: 0 10px 25px rgba(37, 99, 235, 0.5); text-transform: uppercase;
        }
        .btn-action-glass:active { transform: translateY(4px); box-shadow: 0 5px 15px rgba(37, 99, 235, 0.5); }

        /* DASHBOARD SUPERIOR (ESTILO DARK PREMIUM, SEM BRANCO) */
        .top-dashboard {
            background: rgba(15, 23, 42, 0.9); padding: 15px 20px; display: flex; flex-direction: column; gap: 12px; z-index: 5; 
            border-bottom: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
        }
        .dashboard-header { display: flex; justify-content: space-between; align-items: center; }
        .nvl-badge { font-weight: 800; font-size: 15px; color: white; background: rgba(255,255,255,0.1); padding: 5px 15px; border-radius: 12px; letter-spacing: 1px; }
        .clock-display { font-size: 16px; font-weight: 800; font-family: 'Courier New', Courier, monospace; color: #cbd5e1; letter-spacing: 1px; }
        .mini-stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 20px; }
        .mini-stat { display: flex; align-items: center; gap: 8px; }
        .mini-stat .icon { font-size: 16px; }
        .mini-bar-bg { flex-grow: 1; height: 8px; background: rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden; box-shadow: inset 0 1px 3px rgba(0,0,0,0.5); }
        .mini-bar-fill { height: 100%; width: 0%; border-radius: 4px; transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.5s ease; }

        /* TELA DE JOGO PRINCIPAL */
        #tela-jogo { 
            flex-grow: 1; width: 100%; height: 100%; 
            background-color: #0f172a; background-size: 100% 100% !important; background-position: center bottom; 
            background-repeat: no-repeat; display: flex; flex-direction: column; position: relative; 
            overflow: hidden; transition: background-image 1s ease-in-out; 
        }
        #tela-jogo::after { content: ''; position: absolute; inset: 0; background: rgba(15, 23, 42, 0.6); opacity: 0; transition: opacity 1s ease; pointer-events: none; z-index: 1; }
        #tela-jogo.dormindo::after { opacity: 1; }

        /* CONTROLES INFERIORES (ESTILO DARK PREMIUM) */
        #controles { 
            display: flex; justify-content: space-between; gap: 15px; padding: 20px; 
            background: rgba(15, 23, 42, 0.9); border-top: 1px solid rgba(255,255,255,0.1); z-index: 5; 
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
        }
        .btn-principal { 
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.9), rgba(220, 38, 38, 0.9)); color: white; border: 1px solid rgba(255,255,255,0.2); 
            padding: 16px 0; border-radius: 20px; font-size: 15px; font-weight: 800; letter-spacing: 1px; 
            cursor: pointer; transition: all 0.2s; flex: 1; box-shadow: 0 10px 20px rgba(0,0,0,0.3); text-transform: uppercase;
        }
        .btn-principal:active { transform: translateY(3px); box-shadow: 0 4px 10px rgba(0,0,0,0.4); }
        .btn-azul { background: linear-gradient(135deg, rgba(59, 130, 246, 0.9), rgba(37, 99, 235, 0.9)); }

        #sprite-layer { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow: hidden; z-index: 2; pointer-events: none; }
        #poop-layer { position: absolute; bottom: 55px; left: 0; width: 100%; height: 40px; pointer-events: none; z-index: 3; }
        #efeito-limpeza { display: none; position: absolute; inset: 0; z-index: 15; background: rgba(56, 189, 248, 0.3); backdrop-filter: blur(4px); justify-content: center; align-items: center; font-size: 70px; pointer-events: none; }
        
        @keyframes flash-clean { 0% { opacity: 0; transform: scale(0.8); } 30% { opacity: 1; transform: scale(1.1); } 70% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1.2); } }
        @keyframes floatUp { 0% { opacity: 1; transform: translate(-50%, 0) scale(1); } 100% { opacity: 0; transform: translate(-50%, -30px) scale(1.5); } }

        /* TELA DE ECLOSÃO */
        #ovo-container { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; }
        #ovo-wrapper { position: absolute; bottom: 55px; left: 50%; width: 80px; height: 100px; display: flex; justify-content: center; align-items: center; transform: translateX(-50%) scale(0.65); transform-origin: bottom center; filter: drop-shadow(0 15px 5px rgba(0,0,0,0.4)); }
        #tempo-eclosao { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); font-weight: 800; font-size: 14px; color: white; background: rgba(15,23,42,0.8); border: 1px solid rgba(255,255,255,0.2); padding: 8px 20px; border-radius: 20px; backdrop-filter: blur(5px); box-shadow: 0 8px 15px rgba(0,0,0,0.4); text-transform: uppercase; letter-spacing: 1px; }

        .ovo { width: 80px; height: 100px; background-color: #f8fafc; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; box-shadow: inset -15px -15px 25px rgba(0,0,0,0.1), 0 15px 25px rgba(0,0,0,0.2); animation: ovo-tremendo 3s infinite; }
        .ovo-grama { background-image: radial-gradient(circle at 30% 30%, #10b981 12px, transparent 13px), radial-gradient(circle at 75% 60%, #10b981 18px, transparent 19px), radial-gradient(circle at 45% 85%, #10b981 10px, transparent 11px); }
        .ovo-fogo { background-image: radial-gradient(circle at 30% 30%, #ef4444 12px, transparent 13px), radial-gradient(circle at 75% 60%, #ef4444 18px, transparent 19px), radial-gradient(circle at 45% 85%, #ef4444 10px, transparent 11px); }
        .ovo-agua { background-image: radial-gradient(circle at 30% 30%, #3b82f6 12px, transparent 13px), radial-gradient(circle at 75% 60%, #3b82f6 18px, transparent 19px), radial-gradient(circle at 45% 85%, #3b82f6 10px, transparent 11px); }
        .ovo-metade { position: absolute; top: 0; left: 0; width: 80px; height: 100px; background-color: #f8fafc; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; }
        .ovo-topo { clip-path: polygon(0% 0%, 100% 0%, 100% 50%, 80% 40%, 60% 55%, 40% 45%, 20% 60%, 0% 50%); animation: rachar-topo 1.5s forwards cubic-bezier(0.25, 1, 0.5, 1); }
        .ovo-base { clip-path: polygon(0% 50%, 20% 60%, 40% 45%, 60% 55%, 80% 40%, 100% 50%, 100% 100%, 0% 100%); animation: rachar-base 1.5s forwards cubic-bezier(0.25, 1, 0.5, 1); }
        .luz-eclosao { position: absolute; width: 20px; height: 20px; background: #ffffff; border-radius: 50%; box-shadow: 0 0 80px 80px #ffffff; opacity: 0; animation: brilho-eclosao 1.5s forwards; z-index: 10; }

        @keyframes ovo-tremendo { 0%, 80% { transform: rotate(0deg) scale(1); } 85% { transform: rotate(-10deg) scale(1.05); } 90% { transform: rotate(10deg) scale(1.05); } 95% { transform: rotate(-10deg) scale(1.05); } 100% { transform: rotate(0deg) scale(1); } }
        @keyframes rachar-topo { 0%, 20% { transform: translateY(0) rotate(0); } 30% { transform: translateY(-5px) rotate(-5deg); } 40% { transform: translateY(-5px) rotate(5deg); } 60%, 100% { transform: translateY(-80px) rotate(-35deg); opacity: 0; } }
        @keyframes rachar-base { 0%, 20% { transform: translateY(0); } 30%, 40% { transform: translateY(2px); } 60%, 100% { transform: translateY(50px); opacity: 0; } }
        @keyframes brilho-eclosao { 0%, 40% { opacity: 0; transform: scale(1); } 60% { opacity: 1; transform: scale(5); } 100% { opacity: 1; transform: scale(25); } }

        /* OVERLAYS E MENUS INTERNOS */
        .overlay-glass { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); z-index: 20; flex-direction: column; justify-content: center; align-items: center; opacity: 0; transition: opacity 0.3s ease; }
        
        .menu-grid { display: grid; grid-template-columns: 1fr; gap: 12px; width: 85%; }
        .menu-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 85%; }
        
        .menu-btn { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); color: white; padding: 18px 10px; border-radius: 16px; font-size: 15px; font-weight: 700; cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .menu-btn:active { background: rgba(255, 255, 255, 0.1); transform: scale(0.95); }
        .btn-voltar { background: linear-gradient(135deg, rgba(239, 68, 68, 0.8), rgba(220, 38, 38, 0.8)); border: none; margin-top: 20px; width: 85%; box-shadow: 0 8px 20px rgba(239, 68, 68, 0.3); }

        .party-container { width: 90%; max-height: 80%; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding: 10px; }
        .party-slot { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 20px; padding: 15px; display: flex; align-items: center; gap: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.3); cursor: pointer; transition: all 0.2s; position: relative; color: white; }
        .party-slot:active { transform: scale(0.98); background: rgba(255, 255, 255, 0.15); }
        .party-slot.leader { border-color: #f59e0b; background: rgba(245, 158, 11, 0.15); box-shadow: 0 0 20px rgba(245, 158, 11, 0.2); }
        .party-slot.selected-move { border-color: #3b82f6; background: rgba(59, 130, 246, 0.15); box-shadow: 0 0 20px rgba(59, 130, 246, 0.4); }
        .party-sprite-box { width: 50px; height: 50px; flex-shrink: 0; display: flex; justify-content: center; align-items: flex-end; }
        .party-info { flex-grow: 1; display: flex; flex-direction: column; gap: 8px; }
        .party-name-row { display: flex; justify-content: space-between; font-weight: 800; font-size: 15px; text-transform: uppercase; letter-spacing: 1px; }
        .party-hp-bg { width: 100%; height: 6px; background: rgba(255,255,255,0.2); border-radius: 4px; overflow: hidden; }
        .party-hp-fill { height: 100%; background: #10b981; }
        
        .action-modal { position: absolute; inset: 0; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(5px); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 50; }
        .action-modal-box { background: rgba(255, 255, 255, 0.05); padding: 30px 20px; border-radius: 24px; border: 1px solid rgba(255,255,255,0.1); width: 75%; display: flex; flex-direction: column; gap: 15px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
        .modal-title-pet { color: white; margin: 0 0 10px 0; font-size: 22px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; }

        /* TELA DE STATUS COM Z-INDEX MÁXIMO E HIERARQUIA SEGURA */
        #status-overlay { z-index: 60; justify-content: flex-start; padding: 25px; box-sizing: border-box; overflow-y: auto; }
        .status-box { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); padding: 20px; border-radius: 24px; margin-bottom: 20px; width: 100%; box-sizing: border-box; box-shadow: 0 15px 30px rgba(0,0,0,0.3); }
        .status-header { display: flex; align-items: center; gap: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 20px; margin-bottom: 20px; }
        .status-title { font-size: 22px; font-weight: 800; color: #ffffff; letter-spacing: 2px; text-transform: uppercase; }
        .status-subtitle { font-size: 12px; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: 2px; margin-top: 4px; }
        .stat-text-line { display: flex; justify-content: space-between; margin: 10px 0; font-size: 14px; font-weight: 600; color: #cbd5e1; text-transform: uppercase; letter-spacing: 1px; }
        .stat-text-line span:last-child { color: #ffffff; font-weight: 800; font-size: 15px; }
        .section-title { text-align: center; font-weight: 800; font-size: 12px; color: #94a3b8; letter-spacing: 3px; margin-bottom: 20px; text-transform: uppercase; }
        
        .stat-bar-row { display: flex; align-items: center; margin: 15px 0; }
        .stat-label { width: 55px; font-size: 13px; font-weight: 800; color: #cbd5e1; letter-spacing: 1px; }
        .stat-bar-bg { flex-grow: 1; height: 8px; background: rgba(255,255,255,0.1); border-radius: 4px; margin: 0 12px; overflow: hidden; position: relative; }
        .stat-bar-fill { position: absolute; height: 100%; border-radius: 4px; width: 0%; transition: width 1s cubic-bezier(0.2, 0.8, 0.2, 1); }
        .stat-value { width: 45px; text-align: right; font-size: 14px; font-weight: 800; color: white; }
        .fill-exp { background: linear-gradient(90deg, #3b82f6, #60a5fa); }
        .fill-stat { background: linear-gradient(90deg, #10b981, #34d399); }

        #screen-hatch { background-color: #0f172a; justify-content: center; align-items: center; color: white; text-align: center; z-index: 50; }
        .hatch-container { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 40px; border-radius: 28px; width: 85%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; backdrop-filter: blur(20px); box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
        .hatch-texto { font-size: 22px; font-weight: 800; margin-bottom: 0px; min-height: 30px; color: #f8fafc; letter-spacing: 1px; text-transform: uppercase; z-index: 5; text-align: center; }

    </style>
</head>
<body>

    <div id="app-container">
        
        <div id="screen-trainer" class="screen premium-bg">
            <div class="selecao-header">LICENÇA DE TREINADOR</div>
            <div class="premium-card">
                <p style="color: rgba(255,255,255,0.8); font-weight: 600; margin: 0 0 20px 0; font-size: 15px; text-align: center;">Insira seu nome para iniciar a jornada</p>
                <input type="text" id="input-trainer-name" class="premium-input" maxlength="12" placeholder="SEU NOME">
                <button class="btn-action-glass" onclick="registrarTreinador()">INICIAR JORNADA</button>
            </div>
        </div>

        <div id="screen-starter" class="screen premium-bg">
            <div class="selecao-header">ESCOLHA SEU PARCEIRO</div>
            <div class="premium-card" style="margin-top: 10px;">
                <div class="starter-list" id="lista-starters"></div>
            </div>
        </div>

        <div id="screen-game" class="screen">
            <!-- DASHBOARD TOP PREMIUM -->
            <div class="top-dashboard">
                <div class="dashboard-header">
                    <div class="nvl-badge">Nvl <span id="val-nivel">--</span></div>
                    <div class="clock-display" id="game-clock">--:--</div>
                </div>
                <div class="mini-stats-grid">
                    <div class="mini-stat" title="Alimentação">
                        <span class="icon">🍔</span>
                        <div class="mini-bar-bg"><div id="bar-food" class="mini-bar-fill"></div></div>
                    </div>
                    <div class="mini-stat" title="Energia/Disposição">
                        <span class="icon">⚡</span>
                        <div class="mini-bar-bg"><div id="bar-energy" class="mini-bar-fill"></div></div>
                    </div>
                    <div class="mini-stat" title="Higiene">
                        <span class="icon">🧼</span>
                        <div class="mini-bar-bg"><div id="bar-hygiene" class="mini-bar-fill"></div></div>
                    </div>
                    <div class="mini-stat" title="Alegria/Felicidade">
                        <span class="icon">❤️</span>
                        <div class="mini-bar-bg"><div id="bar-joy" class="mini-bar-fill"></div></div>
                    </div>
                </div>
            </div>
            
            <div id="tela-jogo">
                <div id="ovo-container">
                    <div id="ovo-wrapper"></div>
                    <div id="tempo-eclosao"></div>
                </div>
                <div id="efeito-limpeza">✨🧼✨</div>
                <div id="berry-container" style="display: none; position: absolute; bottom: 55px; left: 50%; transform: translateX(35px) scale(1); z-index: 4; font-size: 28px; filter: drop-shadow(0 4px 4px rgba(0,0,0,0.3)); transition: transform 0.1s;"></div>
                <div id="poop-layer"></div>
                <div id="sprite-layer"></div>
            </div>
            
            <!-- CONTROLES BOTTOM PREMIUM -->
            <div id="controles">
                <button class="btn-principal btn-vermelho" onclick="abrirMenu()">INTERAÇÕES</button>
                <button id="btn-main-time" class="btn-principal btn-azul" onclick="abrirParty()">TIME</button>
            </div>
            
            <div id="menu-overlay" class="overlay-glass">
                <div id="menu-principal-wrapper" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
                    <div class="menu-grid">
                        <button class="menu-btn" onclick="abrirSubMenu('alimentar')">ALIMENTAR</button>
                        <button class="menu-btn" onclick="executarAcao('limpar')">LIMPAR</button>
                        <button class="menu-btn" onclick="executarAcao('dormir')" id="btn-dormir">DORMIR / ACORDAR</button>
                    </div>
                    <button class="btn-voltar" style="padding: 18px; border-radius: 16px; color: white; font-weight: 800; cursor: pointer;" onclick="fecharMenu()">FECHAR</button>
                </div>

                <div id="submenu-alimentar" style="display: none; width: 100%; flex-direction: column; align-items: center;">
                    <div style="color: white; font-weight: 800; margin-bottom: 20px; font-size: 18px; letter-spacing: 2px;">ESCOLHA A BERRIE</div>
                    <div class="menu-grid-2">
                        <button class="menu-btn" style="border-color: rgba(239, 68, 68, 0.4);" onclick="darComida('berrie_vermelha')">🍒 Cheri</button>
                        <button class="menu-btn" style="border-color: rgba(59, 130, 246, 0.4);" onclick="darComida('berrie_azul')">🫐 Oran</button>
                        <button class="menu-btn" style="border-color: rgba(16, 185, 129, 0.4);" onclick="darComida('berrie_verde')">🍏 Durin</button>
                        <button class="menu-btn" style="border-color: rgba(234, 179, 8, 0.4);" onclick="darComida('berrie_amarela')">🍋 Aspear</button>
                    </div>
                    <button class="btn-voltar" style="padding: 18px; border-radius: 16px; color: white; font-weight: 800; cursor: pointer;" onclick="voltarMenuPrincipal()">VOLTAR</button>
                </div>
            </div>

            <!-- MENU DO TIME COM CLIQUE SIMPLES -->
            <div id="party-overlay" class="overlay-glass" style="justify-content: flex-start; padding-top: 30px;">
                <div style="color: white; font-weight: 800; font-size: 20px; letter-spacing: 2px; margin-bottom: 20px;">SEU TIME</div>
                <div class="party-container" id="party-list-container"></div>
                <div style="margin-top: auto; padding-bottom: 30px; width: 100%; display: flex; justify-content: center;">
                    <button class="btn-voltar" style="padding: 18px; border-radius: 16px; color: white; font-weight: 800; cursor: pointer;" onclick="fecharParty()">VOLTAR</button>
                </div>

                <div id="slot-action-modal" class="action-modal">
                    <div class="action-modal-box">
                        <h3 class="modal-title-pet" id="modal-pokemon-name">Pokemon</h3>
                        <button class="menu-btn" style="border-color: rgba(59, 130, 246, 0.5);" onclick="ativarModoMover()">MOVER (TROCAR)</button>
                        <button class="menu-btn" style="border-color: rgba(16, 185, 129, 0.5);" onclick="verStatusParty()">STATUS</button>
                        <button class="menu-btn" style="border-color: rgba(239, 68, 68, 0.5); margin-top: 15px;" onclick="fecharModalSlot()">CANCELAR</button>
                    </div>
                </div>
            </div>

            <!-- TELA DE STATUS CORRIGIDA Z-INDEX 60 -->
            <div id="status-overlay" class="overlay-glass">
                <div class="status-box">
                    <div class="status-header">
                        <div id="status-sprite-container" style="margin-right: 20px; filter: drop-shadow(0 8px 10px rgba(0,0,0,0.5)); display: flex; justify-content: center; align-items: center;">⏳</div>
                        <div>
                            <div id="status-nome" class="status-title">--</div>

                    </div>
                    <div class="stat-text-line"><span>Nível</span> <span id="status-lvl">--</span></div>
                    <div class="stat-text-line"><span>Nature</span> <span id="status-nature" style="color: #f59e0b;">--</span></div>
                    <div class="stat-text-line"><span>Treinador ID</span> <span id="status-tid" style="color: #94a3b8; font-family: 'Courier New', Courier, monospace;">-- / --</span></div>
                    
                    <div class="stat-bar-row" style="margin-top: 20px;">
                        <span class="stat-label" style="width: 40px;">EXP</span>
                        <div class="stat-bar-bg"><div id="status-exp-bar" class="stat-bar-fill fill-exp"></div></div>
                        <span class="stat-value" id="status-exp" style="width: 45px; font-size: 13px;">0%</span>

                </div>
                
                <div class="status-box" style="flex-grow: 1;">
                    <div class="section-title">ATRIBUTOS DE BATALHA</div>
                    <div class="stat-bar-row">
                        <span class="stat-label">HP</span>
                        <div class="stat-bar-bg"><div id="bar-hp" class="stat-bar-fill fill-stat"></div></div>
                        <span class="stat-value" id="stat-hp" style="width: 65px;">--</span>
                    </div>
                    <div class="stat-bar-row">
                        <span class="stat-label">ATK</span>
                        <div class="stat-bar-bg"><div id="bar-atk" class="stat-bar-fill fill-stat"></div></div>
                        <span class="stat-value" id="stat-atk" style="width: 65px;">--</span>
                    </div>
                    <div class="stat-bar-row">
                        <span class="stat-label">DEF</span>
                        <div class="stat-bar-bg"><div id="bar-def" class="stat-bar-fill fill-stat"></div></div>
                        <span class="stat-value" id="stat-def" style="width: 65px;">--</span>
                    </div>
                    <div class="stat-bar-row">
                        <span class="stat-label">SP.A</span>
                        <div class="stat-bar-bg"><div id="bar-spa" class="stat-bar-fill fill-stat"></div></div>
                        <span class="stat-value" id="stat-spa" style="width: 65px;">--</span>
                    </div>
                    <div class="stat-bar-row">
                        <span class="stat-label">SP.D</span>
                        <div class="stat-bar-bg"><div id="bar-spd" class="stat-bar-fill fill-stat"></div></div>
                        <span class="stat-value" id="stat-spd" style="width: 65px;">--</span>
                    </div>
                    <div class="stat-bar-row">
                        <span class="stat-label">SPE</span>
                        <div class="stat-bar-bg"><div id="bar-spe" class="stat-bar-fill fill-stat"></div></div>
                        <span class="stat-value" id="stat-spe" style="width: 65px;">--</span>
                    </div>
                </div>
                <button class="btn-voltar" style="padding: 18px; border-radius: 16px; color: white; font-weight: 800; cursor: pointer; width: 100%; margin-top: auto;" onclick="fecharStatus()">FECHAR STATUS</button>
            </div>
        </div>

        <!-- ECLOSÃO CORRIGIDA: IMAGEM RENDERIZADA ANTES DO TEXTO E EM UM CONTAINER ISOLADO -->
        <div id="screen-hatch" class="screen">
            <div class="hatch-container">
                <div id="hatch-sprite-container" style="height: 120px; display: none; justify-content: center; align-items: flex-end; margin-bottom: 20px; filter: drop-shadow(0 10px 15px rgba(0,0,0,0.5));"></div>
                <div id="hatch-texto" class="hatch-texto">Oh?...</div>
                <button id="btn-hatch-continuar" class="btn-action-glass" style="display:none; margin-top:30px; background: white; color: #1e293b;" onclick="concluirEclosao()">CONTINUAR JORNADA</button>
            </div>
        </div>
    </div>
    <script src="database.js"></script>
    <script src="pokemon_engine.js"></script>
    <script>
        let mascotes = [];
        let mascoteAtivo = null;
        let loopEclosao = null;
        let processoEclosaoEmAndamento = false;
        
        let slotAcao = null;
        let modoMover = false;

        const SoundManager = { play(effect) { console.log(`[Audio]: '${effect}'`); } };

        function updateClock() {
            const now = new Date();
            const hs = String(now.getHours()).padStart(2, '0');
            const ms = String(now.getMinutes()).padStart(2, '0');
            const clockEl = document.getElementById('game-clock');
            if(clockEl) clockEl.innerText = `${hs}:${ms}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        function salvarTime() {
            localStorage.setItem('pmd_party', JSON.stringify(mascotes));
        }

        const PMDHelper = {
            async playAnim(containerId, dexId, targetAnimName = 'Idle', scale = 1, flip = false) {
                const container = document.getElementById(containerId);
                if (!container) return;
                
                container.innerHTML = '';
                const dexStr = dexId.toString().padStart(4, '0');
                const basePath = `./sprites/${dexStr}/`;
                
                try {
                    const response = await fetch(basePath + 'AnimData.xml');
                    if (!response.ok) throw new Error("XML não encontrado.");
                    const text = await response.text();
                    
                    const parser = new DOMParser();
                    const xml = parser.parseFromString(text, "text/xml");
                    
                    let animNode = Array.from(xml.querySelectorAll('Anim')).find(a => a.querySelector('Name').textContent === targetAnimName);
                    
                    if (animNode && animNode.querySelector('CopyOf')) {
                        const copyName = animNode.querySelector('CopyOf').textContent;
                        animNode = Array.from(xml.querySelectorAll('Anim')).find(a => a.querySelector('Name').textContent === copyName);
                    }
                    
                    if (!animNode) {
                        animNode = Array.from(xml.querySelectorAll('Anim')).find(a => a.querySelector('Name').textContent === 'Idle');
                        targetAnimName = 'Idle';
                    }

                    if (!animNode) return;

                    const fW = parseInt(animNode.querySelector('FrameWidth').textContent);
                    const fH = parseInt(animNode.querySelector('FrameHeight').textContent);
                    const durNodes = animNode.querySelectorAll('Durations Duration');
                    const durations = Array.from(durNodes).map(d => parseInt(d.textContent));

                    container.style.width = fW + 'px';
                    container.style.height = fH + 'px';
                    container.style.backgroundImage = `url('${basePath}${targetAnimName}-Anim.png')`;
                    container.style.backgroundRepeat = 'no-repeat';
                    container.style.imageRendering = 'pixelated';
                    container.style.transformOrigin = 'center bottom';
                    
                    let transformStr = `scale(${scale})`;
                    if (flip) transformStr += ' scaleX(-1)';
                    container.style.transform = transformStr;

                    let currentFrame = 0;
                    let tick = 0;
                    const direction = 0; 

                    if (container.dataset.intervalId) { clearInterval(parseInt(container.dataset.intervalId)); }

                    const intervalId = setInterval(() => {
                        tick += 0.5; 
                        if (tick >= durations[currentFrame]) {
                            tick = 0;
                            currentFrame++;
                            if (currentFrame >= durations.length) currentFrame = 0;
                            
                            const bgPosX = -(currentFrame * fW);
                            const bgPosY = -(direction * fH);
                            container.style.backgroundPosition = `${bgPosX}px ${bgPosY}px`;
                        }
                    }, 1000 / 60); 

                    container.dataset.intervalId = intervalId;

                } catch(e) {
                    console.error("Falha ao injetar animação local:", e);
                    container.innerHTML = '❌'; 
                    container.style.fontSize = '12px';
                }
            }
        };

        const PetEngine = {
            element: null, state: 'Idle', direction: 6, 
            x: 0, containerW: 0, containerH: 0, speed: 0.15, 
            isRunning: false, dormindo: false, actionTimer: 0,
            animData: {}, currentFrame: 0, tickCounter: 0, basePath: '', currentActionName: 'Idle',
            lastClickTime: 0,

            init(layerId) {
                const layer = document.getElementById(layerId);
                this.containerW = layer.clientWidth; this.containerH = layer.clientHeight;
                this.x = this.containerW / 2; 
                
                if (!this.element) {
                    this.element = document.createElement('div');
                    this.element.style.position = 'absolute';
                    this.element.style.imageRendering = 'pixelated';
                    this.element.style.transformOrigin = 'center bottom';
                    this.element.style.filter = 'drop-shadow(0 15px 5px rgba(0,0,0,0.4))';
                    this.element.style.transform = 'scale(2.5)';
                    
                    /* GRAVIDADE ABAIXADA PARA 15PX: O Pokémon agora pisa exatamente na terra do cenário */
                    this.element.style.bottom = '15px'; 
                    
                    this.element.style.display = 'flex';
                    this.element.style.justifyContent = 'center';
                    this.element.style.alignItems = 'flex-end';
                    
                    this.element.style.pointerEvents = 'auto';
                    this.element.style.cursor = 'pointer';
                    
                    const handleDoubleTap = (e) => {
                        if (e.type === 'touchstart') e.preventDefault();
                        const now = Date.now();
                        if (now - this.lastClickTime < 500) {
                            this.interagir();
                            this.lastClickTime = 0;
                        } else {
                            this.lastClickTime = now;
                        }
                    };
                    
                    this.element.addEventListener('click', handleDoubleTap);
                    this.element.addEventListener('touchstart', handleDoubleTap, {passive: false});

                    layer.appendChild(this.element);
                }
                
                this.actionTimer = Date.now() + 2000;
                this.isRunning = true; this.loop();
            },

            interagir() {
                if (this.dormindo || this.state === 'Interacting' || mascoteAtivo.isEgg) return;
                
                SoundManager.play('menu_click');
                this.changeAction('IdleFront');
                this.state = 'Interacting';
                this.actionTimer = Date.now() + 2000; 
                
                const heart = document.createElement('div');
                heart.innerText = '❤️';
                heart.style.position = 'absolute';
                heart.style.left = '50%';
                heart.style.top = '-20px';
                heart.style.transform = 'translateX(-50%)';
                heart.style.fontSize = '12px';
                heart.style.pointerEvents = 'none';
                heart.style.animation = 'floatUp 1s ease-out forwards';
                this.element.appendChild(heart);
                
                if (!mascoteAtivo.interacoes) mascoteAtivo.interacoes = [];
                const now = Date.now();
                mascoteAtivo.interacoes = mascoteAtivo.interacoes.filter(t => now - t < 3600000);
                
                if (mascoteAtivo.interacoes.length < 5) {
                    mascoteAtivo.interacoes.push(now);
                    mascoteAtivo.joy = Math.min(100, mascoteAtivo.joy + 0.5);
                    salvarTime();
                    atualizarInterface();
                }
                
                setTimeout(() => {
                    if (heart.parentNode) heart.parentNode.removeChild(heart);
                    if (this.state === 'Interacting') this.state = 'IdleFront';
                }, 1000);
            },

            async parseXML(xmlText) {
                const parser = new DOMParser();
                const xml = parser.parseFromString(xmlText, "text/xml");
                const anims = xml.querySelectorAll('Anim');
                this.animData = {};

                anims.forEach(anim => {
                    const name = anim.querySelector('Name').textContent;
                    const copyOf = anim.querySelector('CopyOf');
                    if (copyOf) { this.animData[name] = { copyOf: copyOf.textContent }; } 
                    else {
                        const fW = parseInt(anim.querySelector('FrameWidth').textContent);
                        const fH = parseInt(anim.querySelector('FrameHeight').textContent);
                        const durNodes = anim.querySelectorAll('Durations Duration');
                        const durations = Array.from(durNodes).map(d => parseInt(d.textContent));
                        this.animData[name] = { frameWidth: fW, frameHeight: fH, durations: durations };
                    }
                });

                Object.keys(this.animData).forEach(key => {
                    if (this.animData[key].copyOf) {
                        const target = this.animData[this.animData[key].copyOf];
                        this.animData[key] = { ...target }; 
                    }
                });
            },

            async setPokemon(id) {
                const dexStr = id.toString().padStart(4, '0');
                this.basePath = `./sprites/${dexStr}/`;

                try {
                    const response = await fetch(this.basePath + 'AnimData.xml');
                    if (!response.ok) throw new Error("XML local não encontrado.");
                    const text = await response.text();
                    this.parseXML(text);
                    
                    this.element.innerHTML = ''; 
                    this.state = null; 
                    this.changeAction(this.dormindo ? 'Sleep' : 'IdleFront');
                } catch(e) {
                    console.error("Falha crassa no Motor PMD Local:", e);
                    this.element.innerHTML = '❌';
                    this.element.style.fontSize = '30px';
                }
            },

            setDormindo(status) {
                this.dormindo = status;
                if (this.dormindo) { 
                    this.element.style.filter = 'brightness(0.5) drop-shadow(0 15px 5px rgba(0,0,0,0.8))'; 
                    this.changeAction('Sleep'); 
                } else { 
                    this.element.style.filter = 'drop-shadow(0 15px 5px rgba(0,0,0,0.4))'; 
                    this.changeAction('IdleFront');
                }
            },

            changeAction(newState) {
                let animName = newState;
                if (newState === 'WalkLeft') { animName = 'Walk'; this.direction = 6; }
                if (newState === 'WalkRight') { animName = 'Walk'; this.direction = 2; }
                if (newState === 'IdleFront') { animName = 'Idle'; this.direction = 0; }
                if (newState === 'Idle') { animName = 'Idle'; } 
                
                if (this.currentActionName === animName && this.state === newState) return;
                
                this.state = newState;
                this.currentActionName = animName;
                this.currentFrame = 0;
                this.tickCounter = 0;

                const anim = this.animData[animName] || this.animData['Idle'];
                if (!anim) return;

                this.element.style.width = anim.frameWidth + 'px';
                this.element.style.height = anim.frameHeight + 'px';
                this.element.style.backgroundImage = `url('${this.basePath}${animName}-Anim.png')`;
            },

            updateLogic() {
                if (!this.animData['Idle']) return; 

                if (!this.dormindo && this.state !== 'Interacting') {
                    if (mascoteAtivo && (mascoteAtivo.food < 10 || mascoteAtivo.energy < 10 || mascoteAtivo.hygiene < 10 || mascoteAtivo.joy < 10)) {
                        const center = this.containerW / 2;
                        if (Math.abs(this.x - center) > 2) {
                            this.changeAction(this.x > center ? 'WalkLeft' : 'WalkRight');
                            this.x += (this.x > center ? -this.speed : this.speed);
                        } else {
                            this.x = center;
                            this.changeAction('IdleFront'); 
                        }
                        return; 
                    }

                    let modSpeed = this.speed;
                    if (mascoteAtivo && (mascoteAtivo.hygiene < 30 || mascoteAtivo.food < 30 || mascoteAtivo.joy < 30)) {
                        modSpeed = this.speed * 0.3; 
                    }

                    if (Date.now() > this.actionTimer) {
                        this.actionTimer = Date.now() + 4000 + Math.random() * 6000;
                        const r = Math.random();
                        if (r < 0.15) this.changeAction('WalkLeft');
                        else if (r < 0.30) this.changeAction('WalkRight');
                        else this.changeAction('IdleFront');
                    }
                    if (this.state.startsWith('Walk')) {
                        if (this.direction === 2) this.x += modSpeed;
                        if (this.direction === 6) this.x -= modSpeed;
                        if (this.x < 40) { this.x = 40; this.changeAction('WalkRight'); }
                        if (this.x > this.containerW - 40) { this.x = this.containerW - 40; this.changeAction('WalkLeft'); }
                    }
                }

                const anim = this.animData[this.currentActionName] || this.animData['Idle'];
                this.tickCounter += 0.5; 
                if (this.tickCounter >= anim.durations[this.currentFrame]) {
                    this.tickCounter = 0;
                    this.currentFrame++;
                    if (this.currentFrame >= anim.durations.length) {
                        this.currentFrame = 0; 
                    }
                }
            },

            draw() {
                if (!this.animData['Idle']) return;
                
                const anim = this.animData[this.currentActionName] || this.animData['Idle'];
                this.element.style.left = (this.x - (anim.frameWidth / 2)) + 'px';
                
                const bgPosX = -(this.currentFrame * anim.frameWidth);
                const bgPosY = -(this.direction * anim.frameHeight);
                this.element.style.backgroundPosition = `${bgPosX}px ${bgPosY}px`;
            },

            loop() {
                if (!this.isRunning) return;
                this.updateLogic(); this.draw();
                requestAnimationFrame(() => this.loop());
            }
        };

        function mostrarEcra(idEcra) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(idEcra).classList.add('active');
        }

        const DicionarioTipos = {
            'grama': 'grass', 'fogo': 'fire', 'agua': 'water', 'normal': 'normal',
            'eletrico': 'electric', 'gelo': 'ice', 'lutador': 'fighting', 'veneno': 'poison',
            'terrestre': 'ground', 'voador': 'flying', 'psiquico': 'psychic', 'inseto': 'bug',
            'pedra': 'rock', 'fantasma': 'ghost', 'dragao': 'dragon', 'sombrio': 'dark',
            'aco': 'steel', 'fada': 'fairy'
        };

        function atualizarBioma(tipoPokemon) {
            const telaJogo = document.getElementById('tela-jogo');
            const tipoIngles = DicionarioTipos[tipoPokemon] || 'normal';
            const horaAtual = new Date().getHours();
            const isNoite = horaAtual >= 18 || horaAtual < 6;
            const sufixoTempo = isNoite ? '_night' : '';
            const urlBackground = `https://raw.githubusercontent.com/coisas3d/pokeweb/main/bioma/back_${tipoIngles}${sufixoTempo}.jpg`;
            telaJogo.style.backgroundImage = `url('${urlBackground}')`;
        }

        function registrarTreinador() {
            const nomeStr = document.getElementById('input-trainer-name').value.trim().toUpperCase();
            if (nomeStr.length < 2) {
                alert("Por favor, insira um nome válido (mínimo 2 letras).");
                return;
            }
            SoundManager.play('menu_click');
            
            const randomTid = Math.floor(10000 + Math.random() * 90000).toString();
            window.trainerData = { name: nomeStr, tid: randomTid };
            localStorage.setItem('pmd_trainer', JSON.stringify(window.trainerData));
            
            mostrarStarters('kanto');
        }

        async function iniciarJogo() {
            try {
                const trainerRaw = localStorage.getItem('pmd_trainer');
                if (!trainerRaw) {
                    mostrarEcra('screen-trainer');
                    return;
                }
                
                window.trainerData = JSON.parse(trainerRaw);
                
                const partyRaw = localStorage.getItem('pmd_party');
                if (partyRaw) {
                    const savedParty = JSON.parse(partyRaw);
                    mascotes = savedParty.map(p => {
                        Object.setPrototypeOf(p, PokemonInstance.prototype);
                        return TimeManager.calculateOfflineProgression(p);
                    });
                } else {
                    let oldSave = await loadGame();
                    if (oldSave && oldSave.species) {
                        Object.setPrototypeOf(oldSave, PokemonInstance.prototype);
                        oldSave = TimeManager.calculateOfflineProgression(oldSave);
                        mascotes = [oldSave];
                        salvarTime();
                    }
                }

                if (mascotes.length > 0) {
                    mascoteAtivo = mascotes[0];
                    atualizarBioma(mascoteAtivo.species.type);
                    mostrarEcra('screen-game');
                    atualizarInterface();
                } else {
                    mostrarStarters('kanto');
                }
            } catch (erro) { 
                console.error("Erro fatal ao iniciar:", erro); 
                mostrarEcra('screen-trainer');
            }
        }

        function gerarBotaoStarter(id, nome) {
            return `<div class="btn-starter" onclick="escolherStarter(${id})">
                        <div class="starter-sprite-box" id="sprite-starter-${id}">⏳</div>
                        <span>${nome}</span>
                    </div>`;
        }

        function mostrarStarters(regiao) {
            const lista = document.getElementById('lista-starters');
            let idsParaCarregar = [];
            
            if (regiao === 'kanto') { 
                lista.innerHTML = gerarBotaoStarter(1, "Bulbasaur") + gerarBotaoStarter(4, "Charmander") + gerarBotaoStarter(7, "Squirtle"); 
                idsParaCarregar = [1, 4, 7];
            } 
            
            mostrarEcra('screen-starter');
            idsParaCarregar.forEach(id => PMDHelper.playAnim(`sprite-starter-${id}`, id, 'Idle', 1.5));
        }

        async function escolherStarter(id) {
            SoundManager.play('select_pokemon');
            let novoMascote = new PokemonInstance(id);
            
            if (window.trainerData) {
                novoMascote.otName = window.trainerData.name;
                novoMascote.trainerId = window.trainerData.tid;
            }

            mascotes.push(novoMascote);
            salvarTime();
            
            mascoteAtivo = mascotes[0];
            atualizarBioma(mascoteAtivo.species.type);
            mostrarEcra('screen-game');
            atualizarInterface();
        }

        function acionarEfeitoEclosao() {
            if (processoEclosaoEmAndamento) return;
            processoEclosaoEmAndamento = true;
            if(loopEclosao) clearInterval(loopEclosao);
            
            const ovoWrapper = document.getElementById('ovo-wrapper');
            const textoEclosao = document.getElementById('tempo-eclosao');
            const tipo = mascoteAtivo.species.type;
            
            textoEclosao.innerText = "Rachando!";
            SoundManager.play('egg_crack');
            
            ovoWrapper.innerHTML = `
                <div class="luz-eclosao"></div>
                <div class="ovo-metade ovo-base ovo-${tipo}"></div>
                <div class="ovo-metade ovo-topo ovo-${tipo}"></div>
            `;

            setTimeout(() => {
                mostrarEcra('screen-hatch');
                // Alteração estrutural da tela de hatch foi feita diretamente no HTML acima para consertar o espaçamento
                document.getElementById('hatch-texto').innerText = `Nasceu um\n${mascoteAtivo.species.name.toUpperCase()}!`;
                
                document.getElementById('hatch-sprite-container').style.display = "flex";
                PMDHelper.playAnim('hatch-sprite-container', mascoteAtivo.species.id, 'Idle', 2.5);
                
                document.getElementById('btn-hatch-continuar').style.display = "block";
                
                setTimeout(() => { SoundManager.play('pokemon_cry_' + mascoteAtivo.species.id); }, 500);
            }, 1500);
        }

        function concluirEclosao() {
            SoundManager.play('menu_click');
            mascoteAtivo.isEgg = false;
            salvarTime();
            
            mostrarEcra('screen-game');
            atualizarBioma(mascoteAtivo.species.type);
            
            processoEclosaoEmAndamento = false;
            
            if (loopEclosao) {
                clearInterval(loopEclosao);
                loopEclosao = null;
            }
            
            atualizarInterface();
        }

        function obterCorStatus(valor) {
            if (valor > 50) return '#10b981'; 
            if (valor > 10) return '#f59e0b'; 
            return '#ef4444'; 
        }

        function atualizarInterface() {
            if (!mascoteAtivo) return;
            
            document.getElementById('val-nivel').innerText = mascoteAtivo.isEgg ? `--` : mascoteAtivo.level;
            
            if (mascoteAtivo.isEgg) {
                ['food', 'energy', 'hygiene', 'joy'].forEach(stat => {
                    const barra = document.getElementById(`bar-${stat}`);
                    if (barra) { barra.style.width = '0%'; barra.style.backgroundColor = '#cbd5e1'; }
                });
            } else {
                const statusList = ['food', 'energy', 'hygiene', 'joy'];
                statusList.forEach(stat => {
                    const barra = document.getElementById(`bar-${stat}`);
                    if (barra) {
                        const valorReal = Math.floor(mascoteAtivo[stat]);
                        barra.style.width = `${valorReal}%`;
                        barra.style.backgroundColor = obterCorStatus(valorReal);
                    }
                });
            }

            const poopLayer = document.getElementById('poop-layer');
            poopLayer.innerHTML = '';
            if (!mascoteAtivo.isEgg && mascoteAtivo.poops > 0) {
                for(let i=0; i<mascoteAtivo.poops; i++) {
                    const poop = document.createElement('div');
                    poop.innerText = '💩';
                    poop.style.position = 'absolute';
                    poop.style.fontSize = '26px';
                    poop.style.bottom = '5px';
                    poop.style.left = (20 + (i * 25)) + '%';
                    poop.style.filter = 'drop-shadow(0 5px 2px rgba(0,0,0,0.6))';
                    poopLayer.appendChild(poop);
                }
            }

            const telaJogo = document.getElementById('tela-jogo');
            if (mascoteAtivo.sleep) telaJogo.classList.add('dormindo');
            else telaJogo.classList.remove('dormindo');

            const ovoContainer = document.getElementById('ovo-container');
            const ovoWrapper = document.getElementById('ovo-wrapper');
            const spriteLayer = document.getElementById('sprite-layer');
            const textoEclosao = document.getElementById('tempo-eclosao');
            const btnTime = document.getElementById('btn-main-time');

            if (mascoteAtivo.isEgg) {
                ovoContainer.style.display = 'flex';
                spriteLayer.style.display = 'none';
                
                if(btnTime) {
                    btnTime.style.opacity = '0.5';
                    btnTime.style.pointerEvents = 'none';
                }

                const tempoRestante = mascoteAtivo.hatchTime - Date.now();
                if (tempoRestante <= 0) {
                    acionarEfeitoEclosao();
                } else {
                    if (!document.getElementById('ovo-visual')) {
                        ovoWrapper.innerHTML = '<div id="ovo-visual" class="ovo"></div>';
                    }
                    const visualOvo = document.getElementById('ovo-visual');
                    visualOvo.className = `ovo ovo-${mascoteAtivo.species.type}`;
                    textoEclosao.innerText = `Chocando... ${Math.ceil(tempoRestante/1000)}s`;
                    
                    if (tempoRestante <= 15000) { visualOvo.style.animationDuration = "0.5s"; } 
                    else if (tempoRestante <= 30000) { visualOvo.style.animationDuration = "1.5s"; } 
                    else { visualOvo.style.animationDuration = "3s"; }

                    if(!loopEclosao) loopEclosao = setInterval(atualizarInterface, 1000);
                }
            } else {
                ovoContainer.style.display = 'none';
                spriteLayer.style.display = 'block';
                
                if(btnTime) {
                    btnTime.style.opacity = '1';
                    btnTime.style.pointerEvents = 'auto';
                }
                
                if (loopEclosao) {
                    clearInterval(loopEclosao);
                    loopEclosao = null;
                }
                
                if (!PetEngine.isRunning) {
                    PetEngine.init('sprite-layer');
                }
                
                PetEngine.setPokemon(mascoteAtivo.species.id); 
                PetEngine.setDormindo(mascoteAtivo.sleep);
            }
        }

        function fadeIn(element) { element.style.display = 'flex'; setTimeout(() => element.style.opacity = '1', 10); }
        function fadeOut(element) { element.style.opacity = '0'; setTimeout(() => element.style.display = 'none', 300); }

        function abrirMenu() { 
            SoundManager.play('menu_open'); 
            fadeIn(document.getElementById('menu-overlay')); 
        }
        
        function abrirSubMenu(menuId) {
            SoundManager.play('menu_click');
            document.getElementById('menu-principal-wrapper').style.display = 'none';
            document.getElementById('submenu-' + menuId).style.display = 'flex';
        }

        function voltarMenuPrincipal() {
            SoundManager.play('menu_click');
            document.getElementById('submenu-alimentar').style.display = 'none';
            document.getElementById('menu-principal-wrapper').style.display = 'flex';
        }

        function fecharMenu() { 
            fadeOut(document.getElementById('menu-overlay')); 
            setTimeout(() => {
                document.getElementById('submenu-alimentar').style.display = 'none';
                document.getElementById('menu-principal-wrapper').style.display = 'flex';
            }, 300);
        }

        function abrirParty() {
            if(mascoteAtivo && mascoteAtivo.isEgg) return;
            SoundManager.play('menu_click');
            fadeIn(document.getElementById('party-overlay'));
            renderParty();
        }
        
        function fecharParty() {
            SoundManager.play('menu_click');
            fadeOut(document.getElementById('party-overlay'));
            modoMover = false;
            slotAcao = null;
        }

        // LÓGICA DE CLIQUE ÚNICO (Adeus Long Press)
        function clicarSlot(index) {
            SoundManager.play('menu_click');
            if (modoMover) {
                if (slotAcao !== null && slotAcao !== index) {
                    const temp = mascotes[slotAcao];
                    mascotes[slotAcao] = mascotes[index];
                    mascotes[index] = temp;
                    
                    modoMover = false;
                    slotAcao = null;
                    salvarTime();
                    mascoteAtivo = mascotes[0];
                    
                    renderParty();
                    atualizarBioma(mascoteAtivo.species.type);
                    PetEngine.element.innerHTML = '';
                    PetEngine.setPokemon(mascoteAtivo.species.id);
                    atualizarInterface();
                } else {
                    modoMover = false;
                    slotAcao = null;
                    renderParty();
                }
            } else {
                slotAcao = index;
                document.getElementById('modal-pokemon-name').innerText = mascotes[index].species.name.toUpperCase();
                document.getElementById('slot-action-modal').style.display = 'flex';
            }
        }

        function ativarModoMover() {
            SoundManager.play('menu_click');
            modoMover = true;
            document.getElementById('slot-action-modal').style.display = 'none';
            renderParty(); 
        }

        function fecharModalSlot() {
            SoundManager.play('menu_click');
            document.getElementById('slot-action-modal').style.display = 'none';
            slotAcao = null;
        }

        // CORREÇÃO DO STATUS: Variável salva antes do fechamento do Modal
        function verStatusParty() {
            const indexAlvo = slotAcao;
            fecharModalSlot();
            abrirStatus(indexAlvo);
        }

        function renderParty() {
            const container = document.getElementById('party-list-container');
            container.innerHTML = '';
            
            mascotes.forEach((poke, index) => {
                const isLeader = index === 0;
                const isSelectedMove = modoMover && slotAcao === index;
                
                const slot = document.createElement('div');
                slot.className = `party-slot ${isLeader ? 'leader' : ''} ${isSelectedMove ? 'selected-move' : ''}`;
                
                slot.innerHTML = `
                    <div class="party-sprite-box" id="party-sprite-${index}">⏳</div>
                    <div class="party-info">
                        <div class="party-name-row">
                            <span>${poke.species.name.toUpperCase()}</span>
                            <span>Lv.${poke.isEgg ? '?' : poke.level}</span>
                        </div>
                        <div class="party-hp-bg">
                            <div class="party-hp-fill" style="width: ${poke.isEgg ? 0 : 100}%;"></div>
                        </div>
                    </div>
                `;

                // CLIQUE ÚNICO GARANTIDO (Sem dependência de Toque Longo)
                slot.addEventListener('click', () => clicarSlot(index));

                container.appendChild(slot);
                PMDHelper.playAnim(`party-sprite-${index}`, poke.species.id, 'Idle', 1);
            });
        }

        const maxValores = { hp: 255, atk: 190, def: 230, spa: 194, spd: 230, spe: 200 };

        function fecharStatus() { fadeOut(document.getElementById('status-overlay')); }

        function abrirStatus(index = 0) {
            SoundManager.play('menu_click');
            
            const p = mascotes[index];
            
            PMDHelper.playAnim('status-sprite-container', p.species.id, 'Idle', 1.5);
            
            document.getElementById('status-nome').innerText = p.species.name.toUpperCase();
            document.getElementById('status-tipo').innerText = `TIPO: ${p.species.type.toUpperCase()}`;
            document.getElementById('status-lvl').innerText = p.isEgg ? '--' : p.level;
            
            const expPercent = Math.floor(p.exp * 100);
            document.getElementById('status-exp').innerText = p.isEgg ? '--%' : `${expPercent}%`;
            document.getElementById('status-nature').innerText = p.nature.toUpperCase();
            
            const trainerName = p.otName || 'DESCONHECIDO';
            const trainerId = p.trainerId || '00000';
            document.getElementById('status-tid').innerText = `${trainerName} / ${trainerId}`;
            
            const expBar = document.getElementById('status-exp-bar');
            expBar.style.width = '0%';
            
            const stats = p.isEgg ? { hp:{real:0, penalty:0, final:0}, atk:{real:0, penalty:0, final:0}, def:{real:0, penalty:0, final:0}, spa:{real:0, penalty:0, final:0}, spd:{real:0, penalty:0, final:0}, spe:{real:0, penalty:0, final:0} } : p.calcularStatusReais();
            
            const natureMap = { Lonely: { buff: 'atk', debuff: 'def' }, Brave: { buff: 'atk', debuff: 'spe' }, Adamant: { buff: 'atk', debuff: 'spa' }, Naughty: { buff: 'atk', debuff: 'spd' }, Bold: { buff: 'def', debuff: 'atk' }, Relaxed: { buff: 'def', debuff: 'spe' }, Impish: { buff: 'def', debuff: 'spa' }, Lax: { buff: 'def', debuff: 'spd' }, Timid: { buff: 'spe', debuff: 'atk' }, Hasty: { buff: 'spe', debuff: 'def' }, Jolly: { buff: 'spe', debuff: 'spa' }, Naive: { buff: 'spe', debuff: 'spd' }, Modest: { buff: 'spa', debuff: 'atk' }, Mild: { buff: 'spa', debuff: 'def' }, Quiet: { buff: 'spa', debuff: 'spe' }, Rash: { buff: 'spa', debuff: 'spd' }, Calm: { buff: 'spd', debuff: 'atk' }, Gentle: { buff: 'spd', debuff: 'def' }, Sassy: { buff: 'spd', debuff: 'spe' }, Careful: { buff: 'spd', debuff: 'spa' } };
            const currentNature = natureMap[p.nature] || { buff: null, debuff: null };

            const renderStat = (statId, barId, statObj, key) => {
                const el = document.getElementById(statId);
                const bar = document.getElementById(barId);
                const real = statObj.real;
                const penalty = statObj.penalty;
                const finalVal = statObj.final;

                if (p.isEgg) {
                    el.innerText = '--';
                    bar.style.width = '0%';
                    bar.style.background = 'transparent';
                    bar.innerHTML = '';
                    return;
                }

                if (penalty > 0) { el.innerHTML = `${real} <span style="color: #ef4444; font-size: 0.8em; margin-left: 4px;">(-${penalty})</span>`; } 
                else { el.innerText = real; }

                if (currentNature.buff === key) el.style.color = "#34d399"; 
                else if (currentNature.debuff === key && penalty === 0) el.style.color = "#f87171"; 
                else if (penalty === 0) el.style.color = "#ffffff"; 

                bar.style.width = '0%'; 
                
                setTimeout(() => { 
                    const lvl = p.level;
                    const maxLocal = key === 'hp' ? Math.floor(((2 * maxValores[key] + 94) * lvl) / 100 + lvl + 10) : Math.floor((((2 * maxValores[key] + 94) * lvl) / 100 + 5) * 1.1);
                    const pct = Math.min(100, (real / maxLocal) * 100);
                    
                    bar.style.width = pct + '%'; 
                    bar.style.background = 'transparent';
                    bar.innerHTML = `
                        <div style="display:flex; width: 100%; height: 100%;">
                            <div class="fill-stat" style="width: ${(finalVal / real) * 100}%; height: 100%; border-radius: 4px;"></div>
                            ${penalty > 0 ? `<div style="background: rgba(239, 68, 68, 0.8); width: ${(penalty / real) * 100}%; height: 100%; border-radius: 0 4px 4px 0;"></div>` : ''}
                        </div>
                    `;
                }, 50);
            };

            renderStat('stat-hp', 'bar-hp', stats.hp, 'hp');
            renderStat('stat-atk', 'bar-atk', stats.atk, 'atk');
            renderStat('stat-def', 'bar-def', stats.def, 'def');
            renderStat('stat-spa', 'bar-spa', stats.spa, 'spa');
            renderStat('stat-spd', 'bar-spd', stats.spd, 'spd');
            renderStat('stat-spe', 'bar-spe', stats.spe, 'spe');

            fadeIn(document.getElementById('status-overlay'));
            
            if(!p.isEgg) {
                setTimeout(() => { expBar.style.width = `${expPercent}%`; }, 50);
            }
        }

        async function darComida(tipoItem) {
            if (mascoteAtivo.sleep) { alert("O monstrinho está dormindo!"); return; }
            
            fecharMenu();
            SoundManager.play('eat');

            const berrySprites = {
                'berrie_vermelha': '🍒',
                'berrie_azul': '🫐',
                'berrie_verde': '🍏',
                'berrie_amarela': '🍋'
            };

            const berryEl = document.getElementById('berry-container');
            berryEl.style.display = 'block';
            berryEl.style.transform = 'translateX(35px) scale(1)'; 
            
            berryEl.innerText = berrySprites[tipoItem];
            PetEngine.changeAction('Eat'); 

            setTimeout(() => {
                berryEl.style.transform = 'translateX(35px) scale(0.6)';
            }, 700);

            setTimeout(() => {
                berryEl.style.display = 'none';
            }, 1400);

            const pType = mascoteAtivo.species.type; 
            let favBerry = '';
            
            if (['fogo', 'lutador', 'pedra', 'voador'].includes(pType)) favBerry = 'berrie_vermelha';
            else if (['agua', 'gelo', 'psiquico', 'dragao'].includes(pType)) favBerry = 'berrie_azul';
            else if (['grama', 'inseto', 'veneno', 'normal'].includes(pType)) favBerry = 'berrie_verde';
            else favBerry = 'berrie_amarela';

            const foodBeforeEat = mascoteAtivo.food;
            let foodGain = 25;
            let joyGain = 0;
            let isFavorite = (tipoItem === favBerry);

            if (isFavorite) {
                if (foodBeforeEat < 100) { joyGain = 5; } else { joyGain = 0; }
            } else {
                joyGain = -5; 
            }

            mascoteAtivo.food = Math.min(100, mascoteAtivo.food + foodGain);
            mascoteAtivo.joy = Math.min(100, Math.max(0, mascoteAtivo.joy + joyGain));
            salvarTime(); 

            if (isFavorite && joyGain > 0) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.innerText = '❤️';
                    heart.style.position = 'absolute';
                    heart.style.left = '50%';
                    heart.style.top = '-20px';
                    heart.style.transform = 'translateX(-50%)';
                    heart.style.fontSize = '14px';
                    heart.style.pointerEvents = 'none';
                    heart.style.animation = 'floatUp 1s ease-out forwards';
                    PetEngine.element.appendChild(heart);
                    setTimeout(() => { if(heart.parentNode) heart.parentNode.removeChild(heart); }, 1000);
                }, 1400);
            }
            
            setTimeout(() => { 
                PetEngine.changeAction('IdleFront'); 
                atualizarInterface();
            }, 2000); 
        }

        async function executarAcao(acao) {
            if (!mascoteAtivo) return;
            if (mascoteAtivo.isEgg) { alert("Ainda é um ovo! Espere chocar."); fecharMenu(); return; }

            if (acao === 'limpar') {
                if (mascoteAtivo.sleep) { alert("O monstrinho está dormindo!"); } 
                else {
                    SoundManager.play('clean');
                    const efeito = document.getElementById('efeito-limpeza');
                    efeito.style.display = 'flex';
                    efeito.style.animation = 'none';
                    void efeito.offsetWidth; 
                    efeito.style.animation = 'flash-clean 1s ease-out forwards';
                    
                    setTimeout(async () => {
                        mascoteAtivo.hygiene = 100;
                        mascoteAtivo.poops = 0;
                        mascoteAtivo.joy = Math.min(100, mascoteAtivo.joy + 5);
                        salvarTime();
                        atualizarInterface();
                    }, 500);

                    setTimeout(() => { efeito.style.display = 'none'; }, 1000);
                }
            }
            else if (acao === 'dormir') {
                mascoteAtivo.sleep = !mascoteAtivo.sleep;
                salvarTime();
                PetEngine.setDormindo(mascoteAtivo.sleep);
                SoundManager.play(mascoteAtivo.sleep ? 'sleep' : 'wake_up');
                atualizarInterface();
            }
            fecharMenu();
        }

        window.onload = iniciarJogo;
    </script>
</body>
</html>
