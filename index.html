<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PokeWeb - Coisas 3D</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #2c3e50; /* Fundo escuro para destacar o app */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Courier New', Courier, monospace;
            color: #333;
        }

        /* O container que simula o formato de um aplicativo de celular */
        #app-container {
            width: 90%;
            max-width: 400px;
            background-color: #f1f2f6;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Barra de status superior */
        .status-bar {
            width: 100%;
            display: flex;
            justify-content: space-around;
            background-color: #a8d5a2;
            padding: 15px 0;
            font-weight: bold;
            font-size: 18px;
            border-bottom: 3px solid #7cb575;
        }

        /* Tela onde o monstrinho fica */
        #tela-jogo {
            height: 350px;
            background-color: #ccebc5;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-bottom: 4px solid #333;
        }

        .sprite {
            font-size: 100px; /* Ovo bem grande no centro da tela */
            margin: 20px 0;
            animation: pular 1s infinite alternate;
        }

        @keyframes pular {
            from { transform: translateY(0); }
            to { transform: translateY(-10px); }
        }

        /* Área dos botões */
        #controles {
            display: flex;
            justify-content: space-around;
            padding: 20px;
            background-color: #ecf0f1;
        }

        .btn {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 5px 0 #c0392b; /* Efeito 3D no botão */
            cursor: pointer;
        }
        
        /* Efeito de clique no botão */
        .btn:active {
            transform: translateY(5px);
            box-shadow: 0 0 0 #c0392b;
        }
    </style>
</head>
<body>

    <div id="app-container">
        <!-- Status -->
        <div class="status-bar">
            <span id="nivel">Nvl: 1</span>
            <span id="fome">Fome: 10/10</span>
        </div>
        
        <!-- Tela Principal -->
        <div id="tela-jogo">
            <div class="sprite" id="monstrinho">🥚</div>
        </div>

        <!-- Controles -->
        <div id="controles">
            <button class="btn" onclick="alimentar()">Alimentar</button>
            <button class="btn" onclick="treinar()">Treinar</button>
        </div>
    </div>

<script src="pokemon_engine.js"></script>    
</body>
</html>
